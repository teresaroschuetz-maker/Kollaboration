<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortwolke</title>
<style>
  /* >>> Farben: Beere <<< */
  :root {
    --hintergrund: #fbeef3;
    --flaeche:     #ffffff;
    --text:        #2a1420;
    --leise:       #6e5562;
    --rahmen:      #efcfdc;
    --akzent:      #a3195b;
  }

  body { font-family: system-ui, sans-serif; margin: 0; background: var(--hintergrund); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
  #status { font-size: .9rem; color: var(--leise); margin-bottom: .8rem; }
  #fehler { background: #fbebeb; color: #a00; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
  #frage { font-size: 1.8rem; text-align: center; margin: .5rem 0 1.5rem; white-space: pre-wrap; color: var(--akzent); }
  #frage.leer { color: var(--leise); font-weight: 400; font-style: italic; }
  .box { background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 14px;
         padding: 1rem 1.2rem; margin-bottom: 1.5rem; }
  .bearbeiten { display: grid; gap: .5rem; justify-items: start; }
  textarea { width: 100%; box-sizing: border-box; min-height: 3.5rem; padding: .6rem; font: inherit;
             border: 1px solid var(--rahmen); border-radius: 8px; }
  .eingabe { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  .eingabe input { flex: 1; min-width: 12rem; max-width: 28rem; padding: .6rem .9rem; font-size: 1.1rem;
                   border: 1px solid var(--rahmen); border-radius: 999px; }
  input:focus, textarea:focus { outline: 2px solid var(--akzent); outline-offset: 1px; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; border-radius: 999px; border: none;
           background: var(--akzent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  .hinweis { text-align: center; font-size: .9rem; color: var(--leise); margin: .6rem 0 0; }
  #wolke { background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 18px; min-height: 320px;
           position: relative; overflow: hidden; }
  #wolke .leer-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .wort { position: absolute; font-weight: 700; line-height: 1; white-space: nowrap; cursor: default;
          transition: left .6s ease, top .6s ease; }
  .wort-mass { position: absolute; visibility: hidden; font-weight: 700; line-height: 1; white-space: nowrap; }
  .wort.neu { animation: auftauchen .6s ease-out; }
  @keyframes auftauchen { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  .leer-text { color: var(--leise); font-style: italic; }
  #anzahl { text-align: center; color: var(--leise); font-size: .9rem; margin-top: .6rem; }
  body.beamer .eingabe-box { display: none; }
  body.beamer #frage { font-size: 2.4rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="status">Verbinde …</div>
  <div id="fehler" hidden></div>
  <h1 id="frage" class="leer">Noch keine Frage eingetragen.</h1>

  <div class="box bearbeiten" id="frage-bearbeiten" hidden>
    <textarea id="frage-feld" placeholder="Frage für die Wortwolke …"></textarea>
    <button id="frage-speichern">Frage speichern</button>
  </div>

  <div class="box eingabe-box">
    <div class="eingabe">
      <input id="wort-feld" maxlength="40" placeholder="Dein Begriff …">
      <button id="wort-senden">Senden</button>
    </div>
    <p class="hinweis" id="rest"></p>
  </div>

  <div id="wolke"></div>
  <p id="anzahl"></p>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';

// >>> Einstellungen <<<
const MAX_BEGRIFFE = 0;   // Begriffe pro Person, 0 = unbegrenzt
const WORTFARBEN = ['#a3195b', '#5b3fb5', '#1d5fa8', '#1f7a52', '#8a4b00', '#0f6e73', '#b3261e'];

// >>> Hier deine beiden Werte aus Teil 3 eintragen <<<
const supabase = createClient('https://oeqlvlrnflqfevktfyuz.supabase.co', 'sb_publishable_x7jDXG-iMW23TDVUm9HSEA_bDANHESG');

const board = location.hash.slice(1) || 'wolke';
const parameter = new URLSearchParams(location.search);
const bearbeitenModus = parameter.has('bearbeiten');
if (parameter.has('beamer')) document.body.classList.add('beamer');
const $ = id => document.getElementById(id);
const eintraege = new Map();   // Beitrags-Nummer -> Begriff
let bekannt = new Set();       // schon angezeigte Begriffe
let pin = null;

// ---------- Hilfsfunktionen ----------
function lesen(key) { try { return localStorage.getItem(key); } catch { return null; } }
function schreiben(key, wert) { try { localStorage.setItem(key, wert); } catch {} }

function zeigeFehler(text) {
  $('fehler').textContent = 'Fehler: ' + text;
  $('fehler').hidden = false;
}

function element(tag, klasse, text) {
  const el = document.createElement(tag);
  if (klasse) el.className = klasse;
  if (text) el.textContent = text;
  return el;
}

const aufraeumen = text => text.trim().replace(/\s+/g, ' ');
const schluessel = text => aufraeumen(text).toLowerCase();

// Jeder Begriff bekommt immer dieselbe Farbe
function farbeVon(text) {
  let h = 0;
  for (const c of text) h = (h * 31 + c.codePointAt(0)) % 1000003;
  return WORTFARBEN[h % WORTFARBEN.length];
}

// ---------- Begrenzung pro Person ----------
const zaehlerKey = 'wolke-anzahl-' + board;
const limit = bearbeitenModus ? 0 : MAX_BEGRIFFE;
const gesendet = () => Number(lesen(zaehlerKey)) || 0;

function zeigeRest() {
  if (!limit) { $('rest').textContent = ''; return; }
  const rest = Math.max(0, limit - gesendet());
  $('rest').textContent = rest > 0
    ? 'Du kannst noch ' + rest + (rest === 1 ? ' Begriff' : ' Begriffe') + ' eingeben.'
    : 'Danke! Du hast alle deine Begriffe eingegeben.';
  $('wort-feld').disabled = rest === 0;
  $('wort-senden').disabled = rest === 0;
}

// ---------- Wolke zeichnen ----------
function zeichne() {
  const gruppen = new Map();
  for (const text of eintraege.values()) {
    const k = schluessel(text);
    if (!k) continue;
    const g = gruppen.get(k);
    if (g) g.anzahl++;
    else gruppen.set(k, { key: k, text: aufraeumen(text), anzahl: 1 });
  }
  const sortiert = [...gruppen.values()].sort((a, b) => b.anzahl - a.anzahl || a.key.localeCompare(b.key));
  const max = sortiert.length ? sortiert[0].anzahl : 1;

  const wolke = $('wolke');
  $('anzahl').textContent = eintraege.size + (eintraege.size === 1 ? ' Beitrag' : ' Beiträge');
  if (!sortiert.length) {
    wolke.replaceChildren(element('span', 'leer-text', 'Noch keine Begriffe.'));
    wortElemente.clear();
    wolke.style.height = '';
    bekannt = new Set();
    return;
  }
  const leer = wolke.querySelector('.leer-text');
  if (leer) leer.remove();

  // Wörter, die es nicht mehr gibt, entfernen; neue anlegen
  for (const [k, el] of wortElemente) if (!gruppen.has(k)) { el.remove(); wortElemente.delete(k); }
  for (const g of sortiert) {
    let el = wortElemente.get(g.key);
    if (!el) {
      el = element('span', 'wort');
      el.style.color = farbeVon(g.key);
      if (bekannt.size && !bekannt.has(g.key)) el.classList.add('neu');
      wolke.append(el);
      wortElemente.set(g.key, el);
    }
    el.textContent = g.text;
    el.title = g.anzahl + '× genannt';
  }
  bekannt = new Set(gruppen.keys());
  anordnen(sortiert, max);
}

// ---------- Wörter wie eine Wolke anordnen ----------
// Das häufigste Wort kommt in die Mitte, die anderen werden auf einer Spirale nach außen
// so platziert, dass sie sich nicht überlappen. Passt nicht alles hinein, wird alles kleiner.
const wortElemente = new Map();

function streuung(text) {
  let h = 7;
  for (const c of text) h = (h * 131 + c.codePointAt(0)) % 100003;
  return (h % 628) / 100;
}

function platzieren(sortiert, max, B, H, faktor, mass) {
  const plaetze = [];
  const belegt = [];
  const dx = B / H;
  for (const g of sortiert) {
    const rem = (max > 1 ? 1 + 3.5 * (g.anzahl - 1) / (max - 1) : 1.6) * faktor;
    mass.style.fontSize = rem + 'rem';
    mass.textContent = g.text;
    const w = mass.offsetWidth + 10;
    const h = mass.offsetHeight + 6;
    if (w > B - 8 || h > H - 8) return null;
    const start = streuung(g.key);
    let gefunden = null;
    for (let t = 0, r = 0; r < Math.max(B, H); ) {
      const x = B / 2 + r * Math.cos(t + start) * dx * 0.75 - w / 2;
      const y = H / 2 + r * Math.sin(t + start) * 0.75 - h / 2;
      if (x >= 4 && y >= 4 && x + w <= B - 4 && y + h <= H - 4
          && !belegt.some(q => x < q.x + q.w && x + w > q.x && y < q.y + q.h && y + h > q.y)) {
        gefunden = { x, y, w, h };
        break;
      }
      t += 4 / Math.max(r, 4);
      r = 2.2 * t;
    }
    if (!gefunden) return null;
    belegt.push(gefunden);
    plaetze.push({ key: g.key, rem, x: gefunden.x + 5, y: gefunden.y + 3 });
  }
  return plaetze;
}

function anordnen(sortiert, max) {
  const wolke = $('wolke');
  const B = wolke.clientWidth || 600;
  const H = document.body.classList.contains('beamer')
    ? Math.max(360, Math.round(window.innerHeight - wolke.getBoundingClientRect().top - 90))
    : Math.max(320, Math.round(B * 0.6));
  wolke.style.height = H + 'px';
  const mass = element('span', 'wort-mass');
  wolke.append(mass);
  let faktor = 1;
  let plaetze = null;
  for (let versuch = 0; versuch < 15 && !plaetze; versuch++) {
    plaetze = platzieren(sortiert, max, B, H, faktor, mass);
    faktor *= 0.88;
  }
  mass.remove();
  if (!plaetze) return;
  for (const p of plaetze) {
    const el = wortElemente.get(p.key);
    el.style.fontSize = p.rem.toFixed(2) + 'rem';
    el.style.left = Math.round(p.x) + 'px';
    el.style.top = Math.round(p.y) + 'px';
  }
}

// Bei geänderter Fenstergröße neu anordnen
let groesseTimer = null;
window.addEventListener('resize', () => { clearTimeout(groesseTimer); groesseTimer = setTimeout(zeichne, 200); });

// ---------- Begriff senden ----------
async function senden() {
  const text = aufraeumen($('wort-feld').value);
  if (!text) return;
  if (limit && gesendet() >= limit) return;
  $('wort-senden').disabled = true;
  const { error } = await supabase.from('notes').insert({ board, kachel: 'wolke', text });
  $('wort-senden').disabled = false;
  if (error) { zeigeFehler(error.message); return; }
  $('wort-feld').value = '';
  schreiben(zaehlerKey, String(gesendet() + 1));
  zeigeRest();
  if (!$('wort-feld').disabled) $('wort-feld').focus();
}
$('wort-senden').addEventListener('click', senden);
$('wort-feld').addEventListener('keydown', e => { if (e.key === 'Enter') senden(); });

// ---------- Frage ----------
function zeigeFrage(text) {
  const t = (text || '').trim();
  $('frage').textContent = t || 'Noch keine Frage eingetragen.';
  $('frage').classList.toggle('leer', !t);
  if (bearbeitenModus && document.activeElement !== $('frage-feld')) $('frage-feld').value = text || '';
}

if (bearbeitenModus) {
  $('frage-bearbeiten').hidden = false;
  $('frage-speichern').addEventListener('click', async () => {
    if (!pin) pin = ('login');
    if (!pin) return;
    const { error } = await supabase.rpc('fall_speichern',
      { p_board: board, p_fall: 'frage', p_text: $('frage-feld').value, p_pin: pin });
    if (error) { pin = null; zeigeFehler(error.message); }
    else {
      $('frage-speichern').textContent = 'Gespeichert ✓';
      setTimeout(() => { $('frage-speichern').textContent = 'Frage speichern'; }, 2000);
    }
  });
}

// ---------- Laden ----------
zeigeRest();
const [r1, r2] = await Promise.all([
  supabase.from('notes').select('id, text').eq('board', board).eq('kachel', 'wolke'),
  supabase.from('faelle').select('*').eq('board', board).eq('fall', 'frage'),
]);
for (const r of [r1, r2]) if (r.error) zeigeFehler(r.error.message);
(r1.data || []).forEach(z => eintraege.set(z.id, z.text));
if (r2.data && r2.data[0]) zeigeFrage(r2.data[0].beschreibung);
zeichne();

// ---------- Live-Aktualisierung ----------
supabase.channel('wolke-' + board)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notes', filter: 'board=eq.' + board },
      p => { if (p.new.kachel === 'wolke') { eintraege.set(p.new.id, p.new.text); zeichne(); } })
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notes' },
      p => { if (eintraege.delete(p.old.id)) zeichne(); })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'faelle', filter: 'board=eq.' + board },
      p => { if (p.new && p.new.fall === 'frage') zeigeFrage(p.new.beschreibung); })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') $('status').textContent = bearbeitenModus
      ? '● Live verbunden – Bearbeiten-Modus' : '● Live verbunden';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $('status').textContent = '○ Keine Live-Verbindung (siehe Teil 6)';
  });
</script>
</body>
</html>
