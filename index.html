<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meine Tools</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f1ea; color: #222; }
  main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem; }
  h1 { margin: 0 0 .3rem; }
  .untertitel { margin: 0 0 2rem; color: #666; }
  #kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem; }
  .kachel { display: block; background: #fff; border-radius: 12px; padding: 1.4rem;
            text-decoration: none; color: inherit; border-top: 6px solid var(--farbe);
            box-shadow: 0 2px 6px rgba(0,0,0,.1); transition: transform .15s, box-shadow .15s; }
  .kachel:hover, .kachel:focus-visible { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0,0,0,.15); }
  .symbol { font-size: 2.2rem; line-height: 1; }
  .kachel h2 { margin: .7rem 0 .3rem; font-size: 1.2rem; }
  .kachel p { margin: 0; color: #555; font-size: .95rem; }
    /* >>> Farbdesign Startseite: Schiefer <<< */
  body { background: #eef1f5; color: #1c2733; }
  h1 { color: #243b53; }
  .untertitel, .kachel p { color: #52606d; }
</style>
</head>
<body>
<main>
  <h1>Meine Tools</h1>
  <p class="untertitel">Kollaborative Werkzeuge für die Lehre</p>
  <div id="kacheln"></div>
</main>

<script>
// >>> Hier deine Kacheln anpassen <<<
const TOOLS = [
  { symbol: '📌', titel: 'Pinnwand',          text: 'Ideen und Beiträge sammeln',        link: 'verwaltung.html?tool=pinnwand',   farbe: '#e0a800' },
  { symbol: '🧩', titel: 'Fallarbeit',        text: 'Fälle bearbeiten in Gruppen',       link: 'verwaltung.html?tool=fallarbeit', farbe: '#1d5fa8' },
  { symbol: '💡', titel: 'Ideensammlung',     text: 'Brainstorming zu einer Frage',      link: 'verwaltung.html?tool=ideen',      farbe: '#5b3fb5' },
  { symbol: '❓', titel: 'Ideen zu 3 Fragen', text: 'Brainstorming zu mehreren Fragen',  link: 'verwaltung.html?tool=fragen',     farbe: '#1f7a52' },
  { symbol: '⏭️', titel: 'Fragen Schritt für Schritt', text: 'Fragen nacheinander freigeben', link: 'verwaltung.html?tool=schritte', farbe: '#0f6e73' },
  { symbol: '☁️', titel: 'Wortwolke', text: 'Begriffe sammeln und als Wolke zeigen', link: 'verwaltung.html?tool=wolke', farbe: '#a3195b' },
  { symbol: '📊', titel: 'Live-Umfrage', text: 'Abstimmen mit Live-Ergebnis', link: 'verwaltung.html?tool=umfrage', farbe: '#b34700' },
  { symbol: '⚖️', titel: 'Pro und Contra', text: 'Vorschläge abwägen und abstimmen', link: 'verwaltung.html?tool=abstimmung', farbe: '#3949ab' },
  { symbol: '🌳', titel: 'Argumentbaum', text: 'These mit Pro und Contra diskutieren', link: 'verwaltung.html?tool=baum', farbe: '#37474f' },
  { symbol: '🖍️', titel: 'Whiteboard', text: 'Gemeinsam zeichnen und Zettel ordnen', link: 'verwaltung.html?tool=tafel', farbe: '#1e3a5f' },
];

const bereich = document.getElementById('kacheln');
for (const tool of TOOLS) {
  const kachel = document.createElement('a');
  kachel.className = 'kachel';
  kachel.href = tool.link;
  kachel.style.setProperty('--farbe', tool.farbe || '#999');

  const symbol = document.createElement('div');
  symbol.className = 'symbol';
  symbol.textContent = tool.symbol;
  const titel = document.createElement('h2');
  titel.textContent = tool.titel;
  const text = document.createElement('p');
  text.textContent = tool.text;

  kachel.append(symbol, titel, text);
  bereich.append(kachel);
}
</script>
</body>
</html>
