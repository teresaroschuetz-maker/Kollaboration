<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
  /* >>> Farben: Nachtblau <<< */
  :root {
    --hintergrund: #eef3f8;
    --flaeche:     #ffffff;
    --text:        #14213d;
    --leise:       #56637a;
    --rahmen:      #cfd9e6;
    --akzent:      #1e3a5f;
    --akzent-hell: #dde7f3;
  }

  body { font-family: system-ui, sans-serif; margin: 0; background: var(--hintergrund); color: var(--text); }
  main { max-width: 1400px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  #status { font-size: .9rem; color: var(--leise); margin-bottom: .5rem; }
  #fehler { background: #fbebeb; color: #a00; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
  #thema { font-size: 1.5rem; margin: .2rem 0 .8rem; white-space: pre-wrap; }
  #thema.leer { color: var(--leise); }
  .steuerung { background: var(--akzent-hell); border: 2px solid var(--akzent); border-radius: 14px;
               padding: 1rem; margin-bottom: 1rem; display: grid; gap: .5rem; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem .7rem; min-height: 2.8rem;
             border: 1px solid var(--rahmen); border-radius: 8px; }
  .zeile { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .45rem .9rem; font-size: .95rem; cursor: pointer; border-radius: 999px;
           border: 1px solid var(--rahmen); background: var(--flaeche); color: var(--text); }
  button.aktiv, button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600; }

  .werkzeuge { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
               background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 14px;
               padding: .5rem .7rem; margin-bottom: .7rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .trenner { width: 1px; height: 1.6rem; background: var(--rahmen); margin: 0 .2rem; }
  #farben { display: flex; gap: .35rem; flex-wrap: wrap; }
  .farbe { width: 1.7rem; height: 1.7rem; padding: 0; border-radius: 50%; border: 2px solid var(--rahmen); }
  .farbe.aktiv { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .hinweis { font-size: .85rem; color: var(--leise); }

  #rahmen { height: 72vh; overflow: auto; border: 1px solid var(--rahmen); border-radius: 14px; background: var(--flaeche); }
  #flaeche { position: relative; width: 2400px; height: 1600px;
             background-image: radial-gradient(circle, #c9d3e0 1px, transparent 1px); background-size: 24px 24px; }
  #flaeche.stift { cursor: crosshair; touch-action: none; }
  #flaeche.zettel-modus { cursor: copy; }
  #linien { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  .objekt { position: absolute; z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .objekt.zieht { cursor: grabbing; z-index: 3; box-shadow: 0 10px 22px rgba(0,0,0,.25); }
  .objekt.gesperrt { cursor: default; }
  #flaeche.stift .objekt, #flaeche.zettel-modus .objekt { pointer-events: none; }
  .zettel { width: 170px; min-height: 90px; box-sizing: border-box; padding: .7rem .8rem; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,.15); font-size: .95rem; color: #1d1d1d;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .bild-objekt { padding: 4px; background: #fff; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.15); box-sizing: border-box; }
  .bild-objekt img { display: block; width: 100%; height: auto; border-radius: 4px; pointer-events: none; }
  body:not(.lehrend) .objekt.gesperrt::after { content: '🔒'; position: absolute; top: -10px; right: -8px; font-size: .85rem; }
  .schloss, .weg-knopf { position: absolute; top: -12px; width: 30px; height: 30px; padding: 0;
                         font-size: .85rem; box-shadow: 0 2px 6px rgba(0,0,0,.2); z-index: 4; }
  .schloss { right: -12px; }
  .weg-knopf { left: -12px; color: #8a1c14; }
  body:not(.lehrend) .objekt.gesperrt .weg-knopf { display: none; }

  #gross { position: fixed; inset: 0; background: rgba(10,20,35,.85); display: flex; align-items: center;
           justify-content: center; padding: 1.5rem; z-index: 30; cursor: zoom-out; }
  #gross[hidden] { display: none; }
  #gross img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<main>
  <div id="status">Verbinde …</div>
  <div id="fehler" hidden></div>

  <div class="steuerung" id="steuerung" hidden>
    <strong>Whiteboard steuern</strong>
    <textarea id="thema-feld" placeholder="Thema oder Arbeitsauftrag …"></textarea>
    <div class="zeile">
      <button id="thema-speichern" class="haupt">Thema speichern</button>
      <button id="alles-sperren">🔒 Alles sperren</button>
      <button id="alles-entsperren">🔓 Alles entsperren</button>
      <button id="leeren">Ganze Tafel leeren</button>
    </div>
  </div>

  <h1 id="thema" class="leer">Whiteboard</h1>

  <div class="werkzeuge">
    <button data-modus="zeigen">✋ Verschieben</button>
    <button data-modus="stift">✏️ Stift</button>
    <button data-modus="zettel">🗒️ Zettel</button>
    <button id="bild-knopf">🖼️ Bild</button>
    <input type="file" id="bild-datei" accept="image/*" multiple hidden>
    <span class="trenner"></span>
    <span id="farben"></span>
    <span class="trenner"></span>
    <button id="rueckgaengig">↶ Rückgängig</button>
    <span class="hinweis" id="modus-hinweis"></span>
  </div>

  <div id="rahmen">
    <div id="flaeche"><svg id="linien"></svg></div>
  </div>
</main>
<div id="gross" hidden><img alt="Bild in groß"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';

// >>> Farben für Stift und Zettel <<<
const STIFTFARBEN  = ['#1d1d1d', '#1d5fa8', '#b3261e', '#1f7a3d', '#8a4b00', '#6a1b9a'];
const ZETTELFARBEN = ['#fff59d', '#c8f0c8', '#c9e4ff', '#ffb3b0', '#ffe0b2', '#e1d5ff', '#f9c6f0', '#e6e6e6'];

// >>> Bilder: Breite auf der Tafel und gespeicherte Größe (in Pixeln) <<<
const BILD_BREITE = 360;
const MAX_BILD_PIXEL = 1200;

// >>> Hier deine beiden Werte aus Teil 3 eintragen <<<
const supabase = createClient('https://oeqlvlrnflqfevktfyuz.supabase.co', 'sb_publishable_x7jDXG-iMW23TDVUm9HSEA_bDANHESG');

const board = location.hash.slice(1) || 'whiteboard';
const bearbeitenModus = new URLSearchParams(location.search).has('bearbeiten');
if (bearbeitenModus) document.body.classList.add('lehrend');
const $ = id => document.getElementById(id);
const flaeche = $('flaeche');
const svg = $('linien');
const SVGNS = 'http://www.w3.org/2000/svg';

const objekte = new Map();   // Nummer -> { el, typ, gesperrt, zieht, schloss, weg }
let modus = 'zeigen';
let stiftFarbe = STIFTFARBEN[0];
let zettelFarbe = ZETTELFARBEN[0];
let aktuellerStrich = null;
let pin = null;

// ---------- Hilfsfunktionen ----------
function zeigeFehler(text) {
  $('fehler').textContent = 'Fehler: ' + text;
  $('fehler').hidden = false;
}

function element(tag, klasse, text) {
  const el = document.createElement(tag);
  if (klasse) el.className = klasse;
  if (text) el.textContent = text;
  return el;
}

function punktVon(e) {
  const r = flaeche.getBoundingClientRect();
  return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
}

async function mitPin(aktion) {
  if (!pin) pin = prompt('login:');
  if (!pin) return false;
  const { error } = await aktion(pin);
  if (error) { pin = null; zeigeFehler(error.message); return false; }
  return true;
}

$('gross').addEventListener('click', () => { $('gross').hidden = true; });
function zeigeGross(src) {
  $('gross').querySelector('img').src = src;
  $('gross').hidden = false;
}

// ---------- Eigene Objekte wiedererkennen ----------
function eigeneLesen() { try { return JSON.parse(localStorage.getItem('eigene-schluessel') || '{}'); } catch { return {}; } }
const eigene = eigeneLesen();
function eigeneSpeichern() { try { localStorage.setItem('eigene-schluessel', JSON.stringify(eigene)); } catch {} }

async function neuerSchluessel() {
  if (!(window.crypto && crypto.subtle)) return null;
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const schluessel = hex(crypto.getRandomValues(new Uint8Array(16)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(schluessel));
  return { schluessel, hash: hex(new Uint8Array(hash)) };
}

function merkeEigenes(id, k) {
  if (!k) return;
  eigene['whiteboard:' + id] = { s: k.schluessel, b: board, t: Date.now() };
  eigeneSpeichern();
  const o = objekte.get(id);
  if (o) wegKnopfHinzufuegen(o, id);
}

const schluesselVon = id => (eigene['whiteboard:' + id] || {}).s || null;

// Eigene Objekte dieser Tafel in der Reihenfolge ihres Entstehens
function meineIds() {
  return Object.entries(eigene)
    .filter(([key, v]) => key.startsWith('whiteboard:') && v.b === board)
    .sort((a, b) => a[1].t - b[1].t)
    .map(([key]) => Number(key.slice('whiteboard:'.length)));
}

async function eigenesLoeschen(id) {
  const s = schluesselVon(id);
  if (!s) return false;
  const { data, error } = await supabase.rpc('eigenes_loeschen', { p_tabelle: 'whiteboard', p_id: id, p_schluessel: s });
  if (error) { zeigeFehler(error.message); return false; }
  if (!data) { zeigeFehler('Das konnte nicht gelöscht werden (vielleicht ist es gesperrt).'); return false; }
  delete eigene['whiteboard:' + id];
  eigeneSpeichern();
  return true;
}

function pinLoeschen(id) {
  return mitPin(p => supabase.rpc('mit_pin_loeschen', { p_tabelle: 'whiteboard', p_id: id, p_pin: p }));
}

// ---------- Werkzeuge ----------
const HINWEISE = {
  zeigen: 'Zettel und Bilder verschieben, eigene Zettel per Doppelklick bearbeiten. Bilder mit Cmd+V einfügen.',
  stift:  'Auf die Fläche zeichnen.',
  zettel: 'Auf die Fläche tippen, wo der Zettel hin soll.',
};

function setzeModus(m) {
  modus = m;
  for (const b of document.querySelectorAll('[data-modus]')) b.classList.toggle('aktiv', b.dataset.modus === m);
  flaeche.classList.toggle('stift', m === 'stift');
  flaeche.classList.toggle('zettel-modus', m === 'zettel');
  $('modus-hinweis').textContent = HINWEISE[m];
  baueFarben();
}

function baueFarben() {
  const box = $('farben');
  box.replaceChildren();
  if (modus === 'zeigen') return;
  const liste = modus === 'stift' ? STIFTFARBEN : ZETTELFARBEN;
  const aktuell = modus === 'stift' ? stiftFarbe : zettelFarbe;
  for (const f of liste) {
    const b = element('button', 'farbe' + (f === aktuell ? ' aktiv' : ''));
    b.style.background = f;
    b.setAttribute('aria-label', 'Farbe ' + f);
    b.addEventListener('click', () => {
      if (modus === 'stift') stiftFarbe = f; else zettelFarbe = f;
      baueFarben();
    });
    box.append(b);
  }
}

for (const b of document.querySelectorAll('[data-modus]')) {
  b.addEventListener('click', () => setzeModus(b.dataset.modus));
}

// ---------- Objekte anzeigen ----------
function pfadText(punkte) {
  return punkte.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
}

function neuerPfad(farbe) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', farbe);
  p.setAttribute('stroke-width', '3');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.append(p);
  return p;
}

function setzeSperre(o, wert) {
  o.gesperrt = wert;
  if (o.typ === 'linie') return;
  o.el.classList.toggle('gesperrt', wert);
  if (o.schloss) {
    o.schloss.textContent = wert ? '🔒' : '🔓';
    o.schloss.title = wert ? 'Entsperren' : 'Sperren';
  }
}

function schlossHinzufuegen(o, id) {
  const knopf = element('button', 'schloss');
  knopf.addEventListener('pointerdown', e => e.stopPropagation());
  knopf.addEventListener('click', async e => {
    e.stopPropagation();
    const neu = !o.gesperrt;
    if (await mitPin(p => supabase.rpc('whiteboard_sperren', { p_id: id, p_gesperrt: neu, p_pin: p }))) setzeSperre(o, neu);
  });
  o.el.append(knopf);
  o.schloss = knopf;
}

function wegKnopfHinzufuegen(o, id) {
  if (o.weg || o.typ === 'linie' || !(bearbeitenModus || schluesselVon(id))) return;
  const knopf = element('button', 'weg-knopf', '✕');
  knopf.title = 'Löschen';
  knopf.addEventListener('pointerdown', e => e.stopPropagation());
  knopf.addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm(o.typ === 'bild' ? 'Dieses Bild löschen?' : 'Diesen Zettel löschen?')) return;
    const ok = bearbeitenModus ? await pinLoeschen(id) : await eigenesLoeschen(id);
    if (ok) objektEntfernen(id);
  });
  o.el.append(knopf);
  o.weg = knopf;
}

function zeigeObjekt(z) {
  if (z.board !== board) return;
  const vorhanden = objekte.get(z.id);
  if (vorhanden) {
    if (vorhanden.typ !== 'linie' && !vorhanden.zieht && typeof z.x === 'number') {
      vorhanden.el.style.left = z.x + 'px';
      vorhanden.el.style.top = z.y + 'px';
    }
    if (vorhanden.textEl && typeof z.text === 'string') vorhanden.textEl.textContent = z.text;
    if (typeof z.gesperrt === 'boolean') setzeSperre(vorhanden, z.gesperrt);
    return;
  }
  if (z.typ === 'bild' && !(typeof z.bild === 'string' && z.bild.startsWith('data:image/'))) return;

  let el;
  let textEl = null;
  if (z.typ === 'linie') {
    el = neuerPfad(z.farbe);
    el.setAttribute('d', pfadText(z.punkte || []));
  } else {
    if (z.typ === 'bild') {
      el = element('div', 'objekt bild-objekt');
      const img = element('img');
      img.src = z.bild;
      img.alt = 'Bild';
      el.append(img);
      el.style.width = (z.breite || BILD_BREITE) + 'px';
      el.addEventListener('dblclick', () => zeigeGross(z.bild));
    } else {
      el = element('div', 'objekt zettel');
      textEl = element('span', '', z.text || '');
      el.append(textEl);
      el.style.background = z.farbe;
    }
    el.style.left = z.x + 'px';
    el.style.top = z.y + 'px';
    flaeche.append(el);
  }
  const o = { el, textEl, typ: z.typ, gesperrt: false, zieht: false, schloss: null, weg: null };
  if (z.typ === 'zettel') el.addEventListener('dblclick', () => zettelBearbeiten(o, z.id));
  objekte.set(z.id, o);
  if (z.typ !== 'linie') {
    ziehbarMachen(o, z.id);
    if (bearbeitenModus) schlossHinzufuegen(o, z.id);
    wegKnopfHinzufuegen(o, z.id);
  }
  setzeSperre(o, !!z.gesperrt);
}

function objektEntfernen(id) {
  const o = objekte.get(id);
  if (o) { o.el.remove(); objekte.delete(id); }
}

// Eigenen Zettel per Doppelklick bearbeiten (du mit PIN: jeden Zettel)
async function zettelBearbeiten(o, id) {
  if (modus !== 'zeigen') return;
  if (!bearbeitenModus && (!schluesselVon(id) || o.gesperrt)) return;
  const neu = prompt('Zettel bearbeiten:', o.textEl.textContent);
  if (neu === null || !neu.trim()) return;
  const text = neu.trim().slice(0, 300);
  let ok = false;
  if (bearbeitenModus) {
    ok = await mitPin(p => supabase.rpc('mit_pin_bearbeiten',
      { p_tabelle: 'whiteboard', p_id: id, p_pin: p, p_text: text }));
  } else {
    const { data, error } = await supabase.rpc('eigenes_bearbeiten',
      { p_tabelle: 'whiteboard', p_id: id, p_schluessel: schluesselVon(id), p_text: text });
    if (error) zeigeFehler(error.message);
    else if (!data) zeigeFehler('Das konnte nicht geändert werden.');
    ok = !error && data;
  }
  if (ok) o.textEl.textContent = text;
}

async function nachladen(id) {
  const { data, error } = await supabase.from('whiteboard').select('*').eq('id', id).maybeSingle();
  if (error) zeigeFehler(error.message);
  else if (data) zeigeObjekt(data);
}

// ---------- Zeichnen ----------
flaeche.addEventListener('pointerdown', e => {
  if (modus !== 'stift') return;
  e.preventDefault();
  flaeche.setPointerCapture(e.pointerId);
  aktuellerStrich = { punkte: [punktVon(e)], pfad: neuerPfad(stiftFarbe), farbe: stiftFarbe };
});

flaeche.addEventListener('pointermove', e => {
  if (!aktuellerStrich) return;
  const p = punktVon(e);
  const letzter = aktuellerStrich.punkte[aktuellerStrich.punkte.length - 1];
  if (Math.hypot(p[0] - letzter[0], p[1] - letzter[1]) < 3 || aktuellerStrich.punkte.length >= 2000) return;
  aktuellerStrich.punkte.push(p);
  aktuellerStrich.pfad.setAttribute('d', pfadText(aktuellerStrich.punkte));
});

async function strichBeenden() {
  const s = aktuellerStrich;
  aktuellerStrich = null;
  if (!s) return;
  if (s.punkte.length === 1) s.punkte.push([s.punkte[0][0] + 1, s.punkte[0][1]]);
  s.pfad.setAttribute('d', pfadText(s.punkte));
  const k = await neuerSchluessel();
  const { data, error } = await supabase.from('whiteboard')
    .insert({ board, typ: 'linie', farbe: s.farbe, punkte: s.punkte, loesch_hash: k ? k.hash : null }).select().single();
  if (error) { s.pfad.remove(); zeigeFehler(error.message); return; }
  if (objekte.has(data.id)) s.pfad.remove();
  else objekte.set(data.id, { el: s.pfad, typ: 'linie', gesperrt: false, zieht: false, schloss: null, weg: null });
  merkeEigenes(data.id, k);
}
flaeche.addEventListener('pointerup', strichBeenden);
flaeche.addEventListener('pointercancel', strichBeenden);

// ---------- Zettel anlegen ----------
flaeche.addEventListener('click', async e => {
  if (modus !== 'zettel') return;
  const [x, y] = punktVon(e);
  const text = prompt('Text für den Zettel:');
  if (!text || !text.trim()) return;
  const k = await neuerSchluessel();
  const { data, error } = await supabase.from('whiteboard').insert({
    board, typ: 'zettel', farbe: zettelFarbe, text: text.trim().slice(0, 300),
    x: Math.max(0, x - 85), y: Math.max(0, y - 30), loesch_hash: k ? k.hash : null,
  }).select().single();
  if (error) { zeigeFehler(error.message); return; }
  zeigeObjekt(data);
  merkeEigenes(data.id, k);
});

// ---------- Bilder einfügen ----------
function bildVerkleinern(datei) {
  return new Promise((fertig, fehler) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => {
      const faktor = Math.min(1, MAX_BILD_PIXEL / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * faktor);
      c.height = Math.round(img.height * faktor);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let qualitaet = 0.8;
      let daten = c.toDataURL('image/jpeg', qualitaet);
      while (daten.length > 780000 && qualitaet > 0.35) {
        qualitaet -= 0.15;
        daten = c.toDataURL('image/jpeg', qualitaet);
      }
      if (daten.length > 780000) { fehler(new Error('Das Bild ist zu groß.')); return; }
      fertig({ daten, breite: Math.max(60, Math.min(BILD_BREITE, c.width)) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error('Das Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function bildEinfuegen(datei) {
  try {
    const { daten, breite } = await bildVerkleinern(datei);
    const r = $('rahmen');
    const x = Math.max(0, Math.round(r.scrollLeft + r.clientWidth / 2 - breite / 2));
    const y = Math.max(0, Math.round(r.scrollTop + r.clientHeight / 2 - 120));
    const k = await neuerSchluessel();
    const { data, error } = await supabase.from('whiteboard')
      .insert({ board, typ: 'bild', bild: daten, breite, x, y, farbe: '#ffffff', loesch_hash: k ? k.hash : null })
      .select().single();
    if (error) { zeigeFehler(error.message); return; }
    zeigeObjekt(data);
    merkeEigenes(data.id, k);
  } catch (err) {
    zeigeFehler(err.message);
  }
}

document.addEventListener('paste', e => {
  const ziel = document.activeElement;
  if (ziel && (ziel.tagName === 'TEXTAREA' || ziel.tagName === 'INPUT')) return;
  const dateien = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith('image/'));
  if (!dateien.length) return;
  e.preventDefault();
  dateien.forEach(bildEinfuegen);
});

$('bild-knopf').addEventListener('click', () => $('bild-datei').click());
$('bild-datei').addEventListener('change', () => {
  [...$('bild-datei').files].forEach(bildEinfuegen);
  $('bild-datei').value = '';
});

// ---------- Verschieben ----------
function ziehbarMachen(o, id) {
  const el = o.el;
  el.addEventListener('pointerdown', e => {
    if (modus !== 'zeigen' || o.gesperrt) return;
    e.preventDefault();
    e.stopPropagation();
    o.zieht = true;
    el.classList.add('zieht');
    el.setPointerCapture(e.pointerId);
    const start = punktVon(e);
    const startX = parseInt(el.style.left, 10);
    const startY = parseInt(el.style.top, 10);
    const maxX = 2400 - el.offsetWidth;
    const maxY = 1600 - el.offsetHeight;

    const bewegen = ev => {
      const p = punktVon(ev);
      el.style.left = Math.min(maxX, Math.max(0, startX + p[0] - start[0])) + 'px';
      el.style.top = Math.min(maxY, Math.max(0, startY + p[1] - start[1])) + 'px';
    };
    const loslassen = async () => {
      el.removeEventListener('pointermove', bewegen);
      el.removeEventListener('pointerup', loslassen);
      el.removeEventListener('pointercancel', loslassen);
      el.classList.remove('zieht');
      o.zieht = false;
      const x = parseInt(el.style.left, 10);
      const y = parseInt(el.style.top, 10);
      const { error } = await supabase.from('whiteboard').update({ x, y }).eq('id', id);
      if (error) zeigeFehler(error.message);
    };
    el.addEventListener('pointermove', bewegen);
    el.addEventListener('pointerup', loslassen);
    el.addEventListener('pointercancel', loslassen);
  });
}

// ---------- Rückgängig: eigenes zuletzt Erstelltes löschen ----------
$('rueckgaengig').addEventListener('click', async () => {
  const id = meineIds().reverse().find(i => objekte.has(i) && !objekte.get(i).gesperrt);
  if (!id) return;
  if (await eigenesLoeschen(id)) objektEntfernen(id);
});

// ---------- Thema und Steuerung ----------
function zeigeThema(text) {
  const t = (text || '').trim();
  $('thema').textContent = t || 'Whiteboard';
  $('thema').classList.toggle('leer', !t);
  if (bearbeitenModus && document.activeElement !== $('thema-feld')) $('thema-feld').value = text || '';
}

async function alleSperren(wert) {
  if (await mitPin(p => supabase.rpc('whiteboard_alle_sperren', { p_board: board, p_gesperrt: wert, p_pin: p }))) {
    for (const o of objekte.values()) setzeSperre(o, wert);
  }
}

if (bearbeitenModus) {
  $('steuerung').hidden = false;
  $('thema-speichern').addEventListener('click', async () => {
    const text = $('thema-feld').value;
    const ok = await mitPin(p => supabase.rpc('fall_speichern',
      { p_board: board, p_fall: 'frage', p_text: text, p_pin: p }));
    if (ok) {
      zeigeThema(text);
      $('thema-speichern').textContent = 'Gespeichert ✓';
      setTimeout(() => { $('thema-speichern').textContent = 'Thema speichern'; }, 2000);
    }
  });
  $('alles-sperren').addEventListener('click', () => alleSperren(true));
  $('alles-entsperren').addEventListener('click', () => alleSperren(false));
  $('leeren').addEventListener('click', async () => {
    if (!confirm('Wirklich alle Zettel, Bilder und Zeichnungen auf dieser Tafel löschen?')) return;
    if (await mitPin(p => supabase.rpc('whiteboard_leeren', { p_board: board, p_pin: p }))) {
      for (const id of [...objekte.keys()]) objektEntfernen(id);
    }
  });
}

// ---------- Laden ----------
setzeModus('zeigen');
const [r1, r2] = await Promise.all([
  supabase.from('whiteboard').select('*').eq('board', board).order('created_at'),
  supabase.from('faelle').select('*').eq('board', board).eq('fall', 'frage'),
]);
for (const r of [r1, r2]) if (r.error) zeigeFehler(r.error.message);
(r1.data || []).forEach(zeigeObjekt);
if (r2.data && r2.data[0]) zeigeThema(r2.data[0].beschreibung);

// ---------- Live-Aktualisierung ----------
const nurBoard = 'board=eq.' + board;
supabase.channel('whiteboard-' + board)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => { if (p.new.typ === 'bild') { if (!objekte.has(p.new.id)) nachladen(p.new.id); } else zeigeObjekt(p.new); })
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => { if (objekte.has(p.new.id)) zeigeObjekt(p.new); else nachladen(p.new.id); })
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'whiteboard' },
      p => objektEntfernen(p.old.id))
  .on('postgres_changes', { event: '*', schema: 'public', table: 'faelle', filter: nurBoard },
      p => { if (p.new && p.new.fall === 'frage') zeigeThema(p.new.beschreibung); })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') $('status').textContent = bearbeitenModus
      ? '● Live verbunden – Bearbeiten-Modus' : '● Live verbunden';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $('status').textContent = '○ Keine Live-Verbindung (siehe Teil 6)';
    <footer style="text-align:center; font: .85rem system-ui, sans-serif; padding: 1.5rem 1rem; color: #555;">
  <a href="impressum.html" style="color: inherit;">Impressum</a> ·
  <a href="datenschutz.html" style="color: inherit;">Datenschutz</a>
</footer>
  });
</script>
