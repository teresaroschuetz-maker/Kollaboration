<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
  /* >>> Farben: Nachtblau <<< */
  :root {
    --hintergrund: #eef3f8;
    --flaeche:     #ffffff;
    --text:        #14213d;
    --leise:       #56637a;
    --rahmen:      #cfd9e6;
    --akzent:      #1e3a5f;
    --akzent-hell: #dde7f3;
  }

  body { font-family: system-ui, sans-serif; margin: 0; background: var(--hintergrund); color: var(--text); }
  main { max-width: 1400px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  #status { font-size: .9rem; color: var(--leise); margin-bottom: .5rem; }
  #fehler { background: #fbebeb; color: #a00; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
  #thema { font-size: 1.5rem; margin: .2rem 0 .8rem; white-space: pre-wrap; }
  #thema.leer { color: var(--leise); }
  .steuerung { background: var(--akzent-hell); border: 2px solid var(--akzent); border-radius: 14px;
               padding: 1rem; margin-bottom: 1rem; display: grid; gap: .5rem; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem .7rem; min-height: 2.8rem;
             border: 1px solid var(--rahmen); border-radius: 8px; }
  .zeile { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .45rem .9rem; font-size: .95rem; cursor: pointer; border-radius: 999px;
           border: 1px solid var(--rahmen); background: var(--flaeche); color: var(--text); }
  button.aktiv, button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600; }

  .werkzeuge { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
               background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 14px;
               padding: .5rem .7rem; margin-bottom: .7rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .trenner { width: 1px; height: 1.6rem; background: var(--rahmen); margin: 0 .2rem; }
  #farben { display: flex; gap: .35rem; }
  .farbe { width: 1.7rem; height: 1.7rem; padding: 0; border-radius: 50%; border: 2px solid var(--rahmen); }
  .farbe.aktiv { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .hinweis { font-size: .85rem; color: var(--leise); }

  #rahmen { height: 72vh; overflow: auto; border: 1px solid var(--rahmen); border-radius: 14px; background: var(--flaeche); }
  #flaeche { position: relative; width: 2400px; height: 1600px;
             background-image: radial-gradient(circle, #c9d3e0 1px, transparent 1px); background-size: 24px 24px; }
  #flaeche.stift { cursor: crosshair; touch-action: none; }
  #flaeche.zettel-modus { cursor: copy; }
  #linien { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
  .zettel { position: absolute; z-index: 1; width: 170px; min-height: 90px; box-sizing: border-box;
            padding: .7rem .8rem; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.15);
            font-size: .95rem; color: #1d1d1d; white-space: pre-wrap; overflow-wrap: anywhere;
            cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .zettel.zieht { cursor: grabbing; box-shadow: 0 10px 22px rgba(0,0,0,.25); z-index: 3; }
  #flaeche.stift .zettel, #flaeche.zettel-modus .zettel { pointer-events: none; }
</style>
</head>
<body>
<main>
  <div id="status">Verbinde …</div>
  <div id="fehler" hidden></div>

  <div class="steuerung" id="steuerung" hidden>
    <strong>Whiteboard steuern</strong>
    <textarea id="thema-feld" placeholder="Thema oder Arbeitsauftrag …"></textarea>
    <div class="zeile">
      <button id="thema-speichern" class="haupt">Thema speichern</button>
      <button id="leeren">Ganze Tafel leeren</button>
    </div>
  </div>

  <h1 id="thema" class="leer">Whiteboard</h1>

  <div class="werkzeuge">
    <button data-modus="zeigen">✋ Verschieben</button>
    <button data-modus="stift">✏️ Stift</button>
    <button data-modus="zettel">🗒️ Zettel</button>
    <span class="trenner"></span>
    <span id="farben"></span>
    <span class="trenner"></span>
    <button id="rueckgaengig">↶ Rückgängig</button>
    <span class="hinweis" id="modus-hinweis"></span>
  </div>

  <div id="rahmen">
    <div id="flaeche"><svg id="linien"></svg></div>
  </div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';

// >>> Farben für Stift und Zettel <<<
const STIFTFARBEN  = ['#1d1d1d', '#1d5fa8', '#b3261e', '#1f7a3d', '#8a4b00', '#6a1b9a'];
const ZETTELFARBEN = ['#fff59d', '#c8f0c8', '#c9e4ff', '#ffd6e0', '#ffe0b2', '#e1d5ff'];

// >>> Hier deine beiden Werte aus Teil 3 eintragen <<<
const supabase = createClient('https://oeqlvlrnflqfevktfyuz.supabase.co', 'sb_publishable_x7jDXG-iMW23TDVUm9HSEA_bDANHESG');

const board = location.hash.slice(1) || 'whiteboard';
const bearbeitenModus = new URLSearchParams(location.search).has('bearbeiten');
const $ = id => document.getElementById(id);
const flaeche = $('flaeche');
const svg = $('linien');
const SVGNS = 'http://www.w3.org/2000/svg';

const objekte = new Map();   // Nummer -> Zettel oder Strich auf der Fläche
const meine = [];            // eigene Objekte für „Rückgängig“
let modus = 'zeigen';
let stiftFarbe = STIFTFARBEN[0];
let zettelFarbe = ZETTELFARBEN[0];
let aktuellerStrich = null;
let pin = null;

// ---------- Hilfsfunktionen ----------
function zeigeFehler(text) {
  $('fehler').textContent = 'Fehler: ' + text;
  $('fehler').hidden = false;
}

function element(tag, klasse, text) {
  const el = document.createElement(tag);
  if (klasse) el.className = klasse;
  if (text) el.textContent = text;
  return el;
}

function punktVon(e) {
  const r = flaeche.getBoundingClientRect();
  return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
}

async function mitPin(aktion) {
  if (!pin) pin = prompt('Bitte deinen PIN eingeben:');
  if (!pin) return false;
  const { error } = await aktion(pin);
  if (error) { pin = null; zeigeFehler(error.message); return false; }
  return true;
}

// ---------- Werkzeuge ----------
const HINWEISE = {
  zeigen: 'Zettel mit der Maus oder dem Finger verschieben.',
  stift:  'Auf die Fläche zeichnen.',
  zettel: 'Auf die Fläche tippen, wo der Zettel hin soll.',
};

function setzeModus(m) {
  modus = m;
  for (const b of document.querySelectorAll('[data-modus]')) b.classList.toggle('aktiv', b.dataset.modus === m);
  flaeche.classList.toggle('stift', m === 'stift');
  flaeche.classList.toggle('zettel-modus', m === 'zettel');
  $('modus-hinweis').textContent = HINWEISE[m];
  baueFarben();
}

function baueFarben() {
  const box = $('farben');
  box.replaceChildren();
  if (modus === 'zeigen') return;
  const liste = modus === 'stift' ? STIFTFARBEN : ZETTELFARBEN;
  const aktuell = modus === 'stift' ? stiftFarbe : zettelFarbe;
  for (const f of liste) {
    const b = element('button', 'farbe' + (f === aktuell ? ' aktiv' : ''));
    b.style.background = f;
    b.setAttribute('aria-label', 'Farbe ' + f);
    b.addEventListener('click', () => {
      if (modus === 'stift') stiftFarbe = f; else zettelFarbe = f;
      baueFarben();
    });
    box.append(b);
  }
}

for (const b of document.querySelectorAll('[data-modus]')) {
  b.addEventListener('click', () => setzeModus(b.dataset.modus));
}

// ---------- Zettel und Striche anzeigen ----------
function pfadText(punkte) {
  return punkte.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
}

function neuerPfad(farbe) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', farbe);
  p.setAttribute('stroke-width', '3');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.append(p);
  return p;
}

function zeigeObjekt(z) {
  if (z.board !== board) return;
  const vorhanden = objekte.get(z.id);
  if (vorhanden) {
    if (z.typ === 'zettel' && !vorhanden.zieht) {
      vorhanden.el.style.left = z.x + 'px';
      vorhanden.el.style.top = z.y + 'px';
    }
    return;
  }
  let el;
  if (z.typ === 'linie') {
    el = neuerPfad(z.farbe);
    el.setAttribute('d', pfadText(z.punkte || []));
  } else {
    el = element('div', 'zettel', z.text || '');
    el.style.background = z.farbe;
    el.style.left = z.x + 'px';
    el.style.top = z.y + 'px';
    zettelZiehbarMachen(el, z.id);
    flaeche.append(el);
  }
  objekte.set(z.id, { el, zieht: false });
}

function objektEntfernen(id) {
  const o = objekte.get(id);
  if (o) { o.el.remove(); objekte.delete(id); }
}

// ---------- Zeichnen ----------
flaeche.addEventListener('pointerdown', e => {
  if (modus !== 'stift') return;
  e.preventDefault();
  flaeche.setPointerCapture(e.pointerId);
  aktuellerStrich = { punkte: [punktVon(e)], pfad: neuerPfad(stiftFarbe), farbe: stiftFarbe };
});

flaeche.addEventListener('pointermove', e => {
  if (!aktuellerStrich) return;
  const p = punktVon(e);
  const letzter = aktuellerStrich.punkte[aktuellerStrich.punkte.length - 1];
  if (Math.hypot(p[0] - letzter[0], p[1] - letzter[1]) < 3 || aktuellerStrich.punkte.length >= 2000) return;
  aktuellerStrich.punkte.push(p);
  aktuellerStrich.pfad.setAttribute('d', pfadText(aktuellerStrich.punkte));
});

async function strichBeenden() {
  const s = aktuellerStrich;
  aktuellerStrich = null;
  if (!s) return;
  if (s.punkte.length === 1) s.punkte.push([s.punkte[0][0] + 1, s.punkte[0][1]]);
  s.pfad.setAttribute('d', pfadText(s.punkte));
  const { data, error } = await supabase.from('whiteboard')
    .insert({ board, typ: 'linie', farbe: s.farbe, punkte: s.punkte }).select().single();
  if (error) { s.pfad.remove(); zeigeFehler(error.message); return; }
  if (objekte.has(data.id)) s.pfad.remove();
  else objekte.set(data.id, { el: s.pfad, zieht: false });
  meine.push(data.id);
}
flaeche.addEventListener('pointerup', strichBeenden);
flaeche.addEventListener('pointercancel', strichBeenden);

// ---------- Zettel anlegen ----------
flaeche.addEventListener('click', async e => {
  if (modus !== 'zettel') return;
  const [x, y] = punktVon(e);
  const text = prompt('Text für den Zettel:');
  if (!text || !text.trim()) return;
  const { data, error } = await supabase.from('whiteboard').insert({
    board, typ: 'zettel', farbe: zettelFarbe, text: text.trim().slice(0, 300),
    x: Math.max(0, x - 85), y: Math.max(0, y - 30),
  }).select().single();
  if (error) { zeigeFehler(error.message); return; }
  zeigeObjekt(data);
  meine.push(data.id);
});

// ---------- Zettel verschieben ----------
function zettelZiehbarMachen(el, id) {
  el.addEventListener('pointerdown', e => {
    if (modus !== 'zeigen') return;
    const o = objekte.get(id);
    if (!o) return;
    e.preventDefault();
    e.stopPropagation();
    o.zieht = true;
    el.classList.add('zieht');
    el.setPointerCapture(e.pointerId);
    const start = punktVon(e);
    const startX = parseInt(el.style.left, 10);
    const startY = parseInt(el.style.top, 10);

    const bewegen = ev => {
      const p = punktVon(ev);
      el.style.left = Math.min(2230, Math.max(0, startX + p[0] - start[0])) + 'px';
      el.style.top = Math.min(1510, Math.max(0, startY + p[1] - start[1])) + 'px';
    };
    const loslassen = async () => {
      el.removeEventListener('pointermove', bewegen);
      el.removeEventListener('pointerup', loslassen);
      el.removeEventListener('pointercancel', loslassen);
      el.classList.remove('zieht');
      o.zieht = false;
      const x = parseInt(el.style.left, 10);
      const y = parseInt(el.style.top, 10);
      const { error } = await supabase.from('whiteboard').update({ x, y }).eq('id', id);
      if (error) zeigeFehler(error.message);
    };
    el.addEventListener('pointermove', bewegen);
    el.addEventListener('pointerup', loslassen);
    el.addEventListener('pointercancel', loslassen);
  });
}

// ---------- Rückgängig ----------
$('rueckgaengig').addEventListener('click', async () => {
  while (meine.length && !objekte.has(meine[meine.length - 1])) meine.pop();
  const id = meine.pop();
  if (!id) return;
  objektEntfernen(id);
  const { error } = await supabase.from('whiteboard').delete().eq('id', id);
  if (error) zeigeFehler(error.message);
});

// ---------- Thema und Steuerung ----------
function zeigeThema(text) {
  const t = (text || '').trim();
  $('thema').textContent = t || 'Whiteboard';
  $('thema').classList.toggle('leer', !t);
  if (bearbeitenModus && document.activeElement !== $('thema-feld')) $('thema-feld').value = text || '';
}

if (bearbeitenModus) {
  $('steuerung').hidden = false;
  $('thema-speichern').addEventListener('click', async () => {
    const text = $('thema-feld').value;
    const ok = await mitPin(p => supabase.rpc('fall_speichern',
      { p_board: board, p_fall: 'frage', p_text: text, p_pin: p }));
    if (ok) {
      zeigeThema(text);
      $('thema-speichern').textContent = 'Gespeichert ✓';
      setTimeout(() => { $('thema-speichern').textContent = 'Thema speichern'; }, 2000);
    }
  });
  $('leeren').addEventListener('click', async () => {
    if (!confirm('Wirklich alle Zettel und Zeichnungen auf dieser Tafel löschen?')) return;
    if (await mitPin(p => supabase.rpc('whiteboard_leeren', { p_board: board, p_pin: p }))) {
      for (const id of [...objekte.keys()]) objektEntfernen(id);
    }
  });
}

// ---------- Laden ----------
setzeModus('zeigen');
const [r1, r2] = await Promise.all([
  supabase.from('whiteboard').select('*').eq('board', board).order('created_at'),
  supabase.from('faelle').select('*').eq('board', board).eq('fall', 'frage'),
]);
for (const r of [r1, r2]) if (r.error) zeigeFehler(r.error.message);
(r1.data || []).forEach(zeigeObjekt);
if (r2.data && r2.data[0]) zeigeThema(r2.data[0].beschreibung);

// ---------- Live-Aktualisierung ----------
const nurBoard = 'board=eq.' + board;
supabase.channel('whiteboard-' + board)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => zeigeObjekt(p.new))
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => zeigeObjekt(p.new))
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'whiteboard' },
      p => objektEntfernen(p.old.id))
  .on('postgres_changes', { event: '*', schema: 'public', table: 'faelle', filter: nurBoard },
      p => { if (p.new && p.new.fall === 'frage') zeigeThema(p.new.beschreibung); })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') $('status').textContent = bearbeitenModus
      ? '● Live verbunden – Bearbeiten-Modus' : '● Live verbunden';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $('status').textContent = '○ Keine Live-Verbindung (siehe Teil 6)';
  });
</script>
</body>
</html>
