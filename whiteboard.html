<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
  /* >>> Farben: Nachtblau <<< */
  :root {
    --hintergrund: #eef3f8;
    --flaeche:     #ffffff;
    --text:        #14213d;
    --leise:       #56637a;
    --rahmen:      #cfd9e6;
    --akzent:      #1e3a5f;
    --akzent-hell: #dde7f3;
  }

  body { font-family: system-ui, sans-serif; margin: 0; background: var(--hintergrund); color: var(--text); }
  main { max-width: 1400px; margin: 0 auto; padding: 1.2rem 1rem 2rem; }
  #status { font-size: .9rem; color: var(--leise); margin-bottom: .5rem; }
  #fehler { background: #fbebeb; color: #a00; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
  #thema { font-size: 1.5rem; margin: .2rem 0 .8rem; white-space: pre-wrap; }
  #thema.leer { color: var(--leise); }
  .steuerung { background: var(--akzent-hell); border: 2px solid var(--akzent); border-radius: 14px;
               padding: 1rem; margin-bottom: 1rem; display: grid; gap: .5rem; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .5rem .7rem; min-height: 2.8rem;
             border: 1px solid var(--rahmen); border-radius: 8px; }
  .zeile { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { padding: .45rem .9rem; font-size: .95rem; cursor: pointer; border-radius: 999px;
           border: 1px solid var(--rahmen); background: var(--flaeche); color: var(--text); }
  button.aktiv, button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600; }

  .werkzeuge { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
               background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 14px;
               padding: .5rem .7rem; margin-bottom: .7rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .trenner { width: 1px; height: 1.6rem; background: var(--rahmen); margin: 0 .2rem; }
  #farben { display: flex; gap: .35rem; flex-wrap: wrap; }
  .farbe { width: 1.7rem; height: 1.7rem; padding: 0; border-radius: 50%; border: 2px solid var(--rahmen); }
  .farbe.aktiv { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .hinweis { font-size: .85rem; color: var(--leise); }

  #rahmen { height: 72vh; overflow: auto; border: 1px solid var(--rahmen); border-radius: 14px; background: var(--flaeche); }
  #flaeche { position: relative; width: 2400px; height: 1600px;
             background-image: radial-gradient(circle, #c9d3e0 1px, transparent 1px); background-size: 24px 24px; }
  #flaeche.stift { cursor: crosshair; touch-action: none; }
  #flaeche.zettel-modus { cursor: copy; }
  #linien { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  .objekt { position: absolute; z-index: 1; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .objekt.zieht { cursor: grabbing; z-index: 3; box-shadow: 0 10px 22px rgba(0,0,0,.25); }
  .objekt.gesperrt { cursor: default; }
  #flaeche.stift .objekt, #flaeche.zettel-modus .objekt { pointer-events: none; }
  .zettel { width: 170px; min-height: 90px; box-sizing: border-box; padding: .7rem .8rem; border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,.15); font-size: .95rem; color: #1d1d1d;
            white-space: pre-wrap; overflow-wrap: anywhere; }
  .bild-objekt { padding: 4px; background: #fff; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,.15); box-sizing: border-box; }
  .sticker { line-height: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .sticker svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  #flaeche.sticker-modus { cursor: copy; }
  #flaeche.sticker-modus .objekt { pointer-events: none; }
  .sticker-wahl { width: 2.1rem; height: 2.1rem; padding: .2rem; border-radius: 8px; line-height: 0; }
  .sticker-wahl svg { width: 100%; height: 100%; pointer-events: none; }
  .sticker-wahl.aktiv { outline: 3px solid var(--akzent); outline-offset: 1px; background: var(--akzent-hell); }
  .groesse-wahl { padding: .25rem .6rem; font-size: .85rem; }
  #sticker-knopf svg { width: 1.2rem; height: 1.2rem; vertical-align: -.25rem; margin-right: .25rem; }
  #formen-knopf svg { width: 1.2rem; height: 1.1rem; vertical-align: -.2rem; margin-right: .25rem; }
  #flaeche.form-modus { cursor: copy; }
  #flaeche.form-modus .objekt { pointer-events: none; }
  .form-objekt { box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center;
                 font-size: .95rem; color: #1d1d1d; white-space: pre-wrap; overflow-wrap: anywhere; }
  .form-objekt svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .form-objekt .form-text { position: relative; padding: 8% 14%; max-height: 100%; overflow: hidden; }
  .form-objekt.dreieck .form-text { padding-top: 30%; }
  .griff { position: absolute; right: -9px; bottom: -9px; width: 18px; height: 18px; padding: 0; z-index: 4;
           background: #fff; border: 2px solid var(--akzent); border-radius: 4px; cursor: nwse-resize; touch-action: none; }
  body:not(.lehrend) .objekt.gesperrt .griff { display: none; }
  #formen-panel .form-wahl { width: 2.8rem; height: 2.3rem; padding: .25rem; border-radius: 8px; line-height: 0; }
  #formen-panel .form-wahl svg { width: 100%; height: 100%; pointer-events: none; }
  #formen-panel .form-wahl.aktiv { outline: 3px solid var(--akzent); outline-offset: 1px; background: var(--akzent-hell); }
  #formen-panel .farbe.ohne { background: repeating-linear-gradient(45deg, #fff 0 4px, #ddd 4px 8px) !important; }
  #sticker-panel, #formen-panel { position: absolute; top: calc(100% + 6px); left: .7rem; z-index: 20; background: var(--flaeche);
                   border: 1px solid var(--rahmen); border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.18);
                   padding: .8rem; display: grid; gap: .6rem; max-width: min(420px, calc(100vw - 3rem)); }
  #sticker-panel .reihe, #formen-panel .reihe { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
  #sticker-panel .titel, #formen-panel .titel { font-size: .8rem; font-weight: 600; color: var(--leise); }
  #sticker-panel .sticker-wahl { width: 2.6rem; height: 2.6rem; }
  .bild-objekt img { display: block; width: 100%; height: auto; border-radius: 4px; pointer-events: none; }
  body:not(.lehrend) .objekt.gesperrt::after { content: '🔒'; position: absolute; top: -10px; right: -8px; font-size: .85rem; }
  .schloss, .weg-knopf { position: absolute; top: -12px; width: 30px; height: 30px; padding: 0;
                         font-size: .85rem; box-shadow: 0 2px 6px rgba(0,0,0,.2); z-index: 4; }
  .schloss { right: -12px; }
  .weg-knopf { left: -12px; color: #8a1c14; }
  body:not(.lehrend) .objekt.gesperrt .weg-knopf { display: none; }

  #gross { position: fixed; inset: 0; background: rgba(10,20,35,.85); display: flex; align-items: center;
           justify-content: center; padding: 1.5rem; z-index: 30; cursor: zoom-out; }
  #gross[hidden] { display: none; }
  #gross img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
     [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="status">Verbinde …</div>
  <div id="fehler" hidden></div>

  <div class="steuerung" id="steuerung" hidden>
    <strong>Whiteboard steuern</strong>
    <textarea id="thema-feld" placeholder="Thema oder Arbeitsauftrag …"></textarea>
    <div class="zeile">
      <button id="thema-speichern" class="haupt">Thema speichern</button>
      <button id="alles-sperren">🔒 Alles sperren</button>
      <button id="alles-entsperren">🔓 Alles entsperren</button>
      <button id="leeren">Ganze Tafel leeren</button>
    </div>
  </div>

  <h1 id="thema" class="leer">Whiteboard</h1>

  <div class="werkzeuge">
    <button data-modus="zeigen">✋ Verschieben</button>
    <button data-modus="stift">✏️ Stift</button>
    <button data-modus="zettel">🗒️ Zettel</button>
    <button data-modus="sticker" id="sticker-knopf">⭐ Sticker ▾</button>
    <div id="sticker-panel" hidden></div>
    <button data-modus="form" id="formen-knopf">Formen ▾</button>
    <div id="formen-panel" hidden></div>
    <button id="bild-knopf">🖼️ Bild</button>
    <input type="file" id="bild-datei" accept="image/*" multiple hidden>
    <span class="trenner"></span>
    <span id="farben"></span>
    <span class="trenner"></span>
    <button id="rueckgaengig">↶ Rückgängig</button>
    <span class="hinweis" id="modus-hinweis"></span>
  </div>

  <div id="rahmen">
    <div id="flaeche"><svg id="linien"></svg></div>
  </div>
</main>
<div id="gross" hidden><img alt="Bild in groß"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';

// >>> Farben für Stift und Zettel <<<
const STIFTFARBEN  = ['#1d1d1d', '#1d5fa8', '#b3261e', '#1f7a3d', '#8a4b00', '#6a1b9a'];
const ZETTELFARBEN = ['#fff59d', '#c8f0c8', '#c9e4ff', '#ffb3b0', '#ffe0b2', '#e1d5ff', '#f9c6f0', '#e6e6e6'];

// >>> Sticker: Farben für den farbigen Punkt und Größen (in Pixeln) <<<
const STICKERFARBEN = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#212121'];
const STICKERGROESSEN = [['S', 60], ['M', 90], ['L', 130]];

function pfeilSvg(farbe, drehung) {
  return '<g transform="rotate(' + drehung + ' 50 50)"><path d="M8 40 L58 40 L58 18 L94 50 L58 82 L58 60 L8 60 Z" fill="' + farbe
    + '" stroke="rgba(0,0,0,.15)" stroke-width="3" stroke-linejoin="round"/></g>';
}

// Aussehen der Sticker (gezeichnet, damit sie auf allen Geräten gleich aussehen)
const STICKER = {
  stern:  { name: 'Stern', svg: () => '<polygon points="50,6 62,38 96,38 68,58 79,92 50,72 21,92 32,58 4,38 38,38" fill="#fdd835" stroke="#f9a825" stroke-width="4" stroke-linejoin="round"/>' },
  haken:  { name: 'Grünes Häkchen', svg: () => '<circle cx="50" cy="50" r="44" fill="#43a047"/><path d="M28 52 L44 68 L74 34" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>' },
  kreuz:  { name: 'Rotes X', svg: () => '<circle cx="50" cy="50" r="44" fill="#e53935"/><path d="M33 33 L67 67 M67 33 L33 67" stroke="#fff" stroke-width="11" stroke-linecap="round"/>' },
  punkt:  { name: 'Farbiger Punkt', farbig: true, svg: f => '<circle cx="50" cy="50" r="40" fill="' + f + '" stroke="rgba(0,0,0,.15)" stroke-width="3"/>' },
  herz:   { name: 'Herz', svg: () => '<path d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C40 8 46 14 50 22 C54 14 60 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88 Z" fill="#e53935"/>' },
  frage:  { name: 'Fragezeichen', svg: () => '<circle cx="50" cy="50" r="44" fill="#1e88e5"/><path d="M37 38 C37 27 44 22 51 22 C60 22 65 28 65 35 C65 44 52 46 52 57" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="52" cy="73" r="6" fill="#fff"/>' },
  ausruf: { name: 'Ausrufezeichen', svg: () => '<path d="M50 8 L94 88 L6 88 Z" fill="#fb8c00" stroke="#fb8c00" stroke-width="6" stroke-linejoin="round"/><path d="M50 34 L50 60" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="50" cy="74" r="6" fill="#fff"/>' },
  smiley: { name: 'Smiley', svg: () => '<circle cx="50" cy="50" r="44" fill="#fdd835" stroke="#f9a825" stroke-width="4"/><circle cx="36" cy="40" r="6" fill="#3e2723"/><circle cx="64" cy="40" r="6" fill="#3e2723"/><path d="M30 60 C38 74 62 74 70 60" fill="none" stroke="#3e2723" stroke-width="7" stroke-linecap="round"/>' },
  'pfeil-r': { name: 'Pfeil nach rechts', farbig: true, svg: f => pfeilSvg(f, 0) },
  'pfeil-u': { name: 'Pfeil nach unten', farbig: true, svg: f => pfeilSvg(f, 90) },
  'pfeil-l': { name: 'Pfeil nach links', farbig: true, svg: f => pfeilSvg(f, 180) },
  'pfeil-o': { name: 'Pfeil nach oben', farbig: true, svg: f => pfeilSvg(f, 270) },
  daumen: { name: 'Daumen hoch', svg: () => '<circle cx="50" cy="50" r="44" fill="#fdd835"/><path d="M30 48 L40 48 L40 76 L30 76 Z M44 76 L44 48 L54 26 C58 22 64 25 63 31 L60 44 L73 44 C78 44 81 48 80 53 L76 70 C75 74 72 76 68 76 Z" fill="#5d4037"/>' },
};

// >>> Formen: Füllfarben ('none' = nur Rahmen) <<<
const FORMFARBEN = ['#fff59d', '#c8f0c8', '#c9e4ff', '#ffb3b0', '#ffe0b2', '#e1d5ff', '#ffffff', 'none'];
const FORMEN = {
  rechteck:   { name: 'Rechteck', b: 170, h: 110, svg: '<rect x="1.5" y="1.5" width="97" height="97"/>' },
  abgerundet: { name: 'Abgerundetes Rechteck', b: 170, h: 110, svg: '<rect x="1.5" y="1.5" width="97" height="97" rx="14" ry="20"/>' },
  ellipse:    { name: 'Kreis / Ellipse', b: 130, h: 130, svg: '<ellipse cx="50" cy="50" rx="48.5" ry="48.5"/>' },
  dreieck:    { name: 'Dreieck', b: 150, h: 130, svg: '<polygon points="50,1.5 98.5,98.5 1.5,98.5"/>' },
  raute:      { name: 'Raute', b: 160, h: 120, svg: '<polygon points="50,1.5 98.5,50 50,98.5 1.5,50"/>' },
  sprechblase:{ name: 'Sprechblase', b: 180, h: 120, svg: '<path d="M8 2 H92 Q98 2 98 8 V70 Q98 76 92 76 H40 L22 98 L26 76 H8 Q2 76 2 70 V8 Q2 2 8 2 Z"/>' },
};

function formSvg(f, farbe) {
  const form = FORMEN[f] || FORMEN.rechteck;
  const fuellung = farbe === 'none' ? 'none' : farbe;
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<g fill="' + fuellung + '" stroke="' + (farbe === 'none' ? '#1d1d1d' : 'rgba(0,0,0,.45)') + '" stroke-width="2.5"'
    + ' vector-effect="non-scaling-stroke" stroke-linejoin="round">'
    + form.svg.replace(/\/>/g, ' vector-effect="non-scaling-stroke"/>') + '</g></svg>';
}

function formDaten(text) {
  try {
    const d = JSON.parse(text || '{}');
    return { f: FORMEN[d.f] ? d.f : 'rechteck', h: Math.max(40, Math.min(1200, Number(d.h) || 110)), t: typeof d.t === 'string' ? d.t : '' };
  } catch { return { f: 'rechteck', h: 110, t: '' }; }
}

let formArt = 'rechteck';
let formFarbe = FORMFARBEN[2];

// >>> Bilder: Breite auf der Tafel und gespeicherte Größe (in Pixeln) <<<
const BILD_BREITE = 360;
const MAX_BILD_PIXEL = 1200;

// >>> Hier deine beiden Werte aus Teil 3 eintragen <<<
const supabase = createClient('https://oeqlvlrnflqfevktfyuz.supabase.co', 'sb_publishable_x7jDXG-iMW23TDVUm9HSEA_bDANHESG');

const board = location.hash.slice(1) || 'whiteboard';
const bearbeitenModus = new URLSearchParams(location.search).has('bearbeiten');
if (bearbeitenModus) document.body.classList.add('lehrend');
const $ = id => document.getElementById(id);
const flaeche = $('flaeche');
const svg = $('linien');
const SVGNS = 'http://www.w3.org/2000/svg';

const objekte = new Map();   // Nummer -> { el, typ, gesperrt, zieht, schloss, weg }
let modus = 'zeigen';
let stiftFarbe = STIFTFARBEN[0];
let zettelFarbe = ZETTELFARBEN[0];
let stickerArt = 'stern';
let stickerFarbe = STICKERFARBEN[0];
let stickerGroesse = 90;

function stickerSvg(art, farbe) {
  const s = STICKER[art] || STICKER.stern;
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + s.svg(farbe || STICKERFARBEN[0]) + '</svg>';
}
let aktuellerStrich = null;
let pin = null;

// ---------- Hilfsfunktionen ----------
function zeigeFehler(text) {
  $('fehler').textContent = 'Fehler: ' + text;
  $('fehler').hidden = false;
}

function element(tag, klasse, text) {
  const el = document.createElement(tag);
  if (klasse) el.className = klasse;
  if (text) el.textContent = text;
  return el;
}

function punktVon(e) {
  const r = flaeche.getBoundingClientRect();
  return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
}

async function mitPin(aktion) {
  if (!pin) pin = 'login';
  if (!pin) return false;
  const { error } = await aktion(pin);
  if (error) { pin = null; zeigeFehler(error.message); return false; }
  return true;
}

$('gross').addEventListener('click', () => { $('gross').hidden = true; });
function zeigeGross(src) {
  $('gross').querySelector('img').src = src;
  $('gross').hidden = false;
}

// ---------- Eigene Objekte wiedererkennen ----------
function eigeneLesen() { try { return JSON.parse(localStorage.getItem('eigene-schluessel') || '{}'); } catch { return {}; } }
const eigene = eigeneLesen();
function eigeneSpeichern() { try { localStorage.setItem('eigene-schluessel', JSON.stringify(eigene)); } catch {} }

async function neuerSchluessel() {
  if (!(window.crypto && crypto.subtle)) return null;
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const schluessel = hex(crypto.getRandomValues(new Uint8Array(16)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(schluessel));
  return { schluessel, hash: hex(new Uint8Array(hash)) };
}

function merkeEigenes(id, k) {
  if (!k) return;
  eigene['whiteboard:' + id] = { s: k.schluessel, b: board, t: Date.now() };
  eigeneSpeichern();
  const o = objekte.get(id);
  if (o) { wegKnopfHinzufuegen(o, id); griffHinzufuegen(o, id); }
}

const schluesselVon = id => (eigene['whiteboard:' + id] || {}).s || null;

// Eigene Objekte dieser Tafel in der Reihenfolge ihres Entstehens
function meineIds() {
  return Object.entries(eigene)
    .filter(([key, v]) => key.startsWith('whiteboard:') && v.b === board)
    .sort((a, b) => a[1].t - b[1].t)
    .map(([key]) => Number(key.slice('whiteboard:'.length)));
}

async function eigenesLoeschen(id) {
  const s = schluesselVon(id);
  if (!s) return false;
  const { data, error } = await supabase.rpc('eigenes_loeschen', { p_tabelle: 'whiteboard', p_id: id, p_schluessel: s });
  if (error) { zeigeFehler(error.message); return false; }
  if (!data) { zeigeFehler('Das konnte nicht gelöscht werden (vielleicht ist es gesperrt).'); return false; }
  delete eigene['whiteboard:' + id];
  eigeneSpeichern();
  return true;
}

function pinLoeschen(id) {
  return mitPin(p => supabase.rpc('mit_pin_loeschen', { p_tabelle: 'whiteboard', p_id: id, p_pin: p }));
}

// ---------- Werkzeuge ----------
const HINWEISE = {
  zeigen: 'Verschieben. Eigene Zettel und Formen per Doppelklick bearbeiten, eigene Bilder, Sticker und Formen am Griff ◢ unten rechts vergrößern. Bilder mit Cmd+V einfügen.',
  stift:  'Auf die Fläche zeichnen.',
  zettel: 'Auf die Fläche tippen, wo der Zettel hin soll.',
  sticker: 'Auf die Fläche tippen, um den Sticker zu setzen. Anderen Sticker: oben auf „Sticker“ klicken.',
  form: 'Auf die Fläche tippen, um die Form zu setzen. Größe danach am Griff unten rechts ändern.',
};

function setzeModus(m) {
  modus = m;
  for (const b of document.querySelectorAll('[data-modus]')) b.classList.toggle('aktiv', b.dataset.modus === m);
  flaeche.classList.toggle('stift', m === 'stift');
  flaeche.classList.toggle('zettel-modus', m === 'zettel');
  flaeche.classList.toggle('sticker-modus', m === 'sticker');
  flaeche.classList.toggle('form-modus', m === 'form');
  $('modus-hinweis').textContent = HINWEISE[m];
  baueFarben();
}

function baueFarben() {
  const box = $('farben');
  box.replaceChildren();
  if (modus === 'zeigen') return;
  if (modus === 'sticker' || modus === 'form') return;
  const liste = modus === 'stift' ? STIFTFARBEN : ZETTELFARBEN;
  const aktuell = modus === 'stift' ? stiftFarbe : zettelFarbe;
  for (const f of liste) {
    const b = element('button', 'farbe' + (f === aktuell ? ' aktiv' : ''));
    b.style.background = f;
    b.setAttribute('aria-label', 'Farbe ' + f);
    b.addEventListener('click', () => {
      if (modus === 'stift') stiftFarbe = f; else zettelFarbe = f;
      baueFarben();
    });
    box.append(b);
  }
}

for (const b of document.querySelectorAll('[data-modus]')) {
  b.addEventListener('click', () => {
    const war = modus;
    setzeModus(b.dataset.modus);
    if (b.dataset.modus === 'sticker') stickerAuswahl(war !== 'sticker' || $('sticker-panel').hidden);
    else stickerAuswahl(false);
    if (b.dataset.modus === 'form') formAuswahl(war !== 'form' || $('formen-panel').hidden);
    else formAuswahl(false);
  });
}

// ---------- Stickerauswahl (klappt erst beim Klick auf "Sticker" auf) ----------
function stickerAuswahl(offen) {
  const panel = $('sticker-panel');
  panel.hidden = !offen;
  if (!offen) return;
  panel.replaceChildren();
  const reihe = titel => {
    panel.append(element('div', 'titel', titel));
    const r = element('div', 'reihe');
    panel.append(r);
    return r;
  };
  const arten = reihe('Sticker');
  for (const [art, st] of Object.entries(STICKER)) {
    const b = element('button', 'sticker-wahl' + (art === stickerArt ? ' aktiv' : ''));
    b.innerHTML = stickerSvg(art, stickerFarbe);
    b.title = st.name;
    b.setAttribute('aria-label', st.name);
    b.addEventListener('click', () => {
      stickerArt = art;
      zeigeStickerKnopf();
      // Bei farbigen Stickern offen lassen, damit man noch die Farbe wählen kann
      if (st.farbig) stickerAuswahl(true); else stickerAuswahl(false);
    });
    arten.append(b);
  }
  if (STICKER[stickerArt].farbig) {
    const farben = reihe('Farbe');
    for (const f of STICKERFARBEN) {
      const b = element('button', 'farbe' + (f === stickerFarbe ? ' aktiv' : ''));
      b.style.background = f;
      b.setAttribute('aria-label', 'Farbe ' + f);
      b.addEventListener('click', () => { stickerFarbe = f; zeigeStickerKnopf(); stickerAuswahl(false); });
      farben.append(b);
    }
  }
  const groessen = reihe('Größe');
  for (const [name, px] of STICKERGROESSEN) {
    const b = element('button', 'groesse-wahl' + (px === stickerGroesse ? ' aktiv' : ''), name);
    b.addEventListener('click', () => { stickerGroesse = px; stickerAuswahl(true); });
    groessen.append(b);
  }
}

// ---------- Formenauswahl (klappt erst beim Klick auf "Formen" auf) ----------
function formAuswahl(offen) {
  const panel = $('formen-panel');
  panel.hidden = !offen;
  if (!offen) return;
  panel.replaceChildren();
  panel.append(element('div', 'titel', 'Form'));
  const arten = element('div', 'reihe');
  for (const [f, form] of Object.entries(FORMEN)) {
    const b = element('button', 'form-wahl' + (f === formArt ? ' aktiv' : ''));
    b.innerHTML = formSvg(f, formFarbe);
    b.title = form.name;
    b.setAttribute('aria-label', form.name);
    b.addEventListener('click', () => { formArt = f; zeigeFormKnopf(); formAuswahl(true); });
    arten.append(b);
  }
  panel.append(arten, element('div', 'titel', 'Füllung'));
  const farben = element('div', 'reihe');
  for (const f of FORMFARBEN) {
    const b = element('button', 'farbe' + (f === 'none' ? ' ohne' : '') + (f === formFarbe ? ' aktiv' : ''));
    if (f !== 'none') b.style.background = f;
    b.title = f === 'none' ? 'Nur Rahmen' : 'Farbe ' + f;
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', () => { formFarbe = f; zeigeFormKnopf(); formAuswahl(false); });
    farben.append(b);
  }
  panel.append(farben);
}

function zeigeFormKnopf() {
  $('formen-knopf').innerHTML = formSvg(formArt, formFarbe) + 'Formen ▾';
  $('formen-knopf').title = FORMEN[formArt].name + ' – zum Ändern klicken';
}

function zeigeStickerKnopf() {
  $('sticker-knopf').innerHTML = stickerSvg(stickerArt, stickerFarbe) + 'Sticker ▾';
  $('sticker-knopf').title = STICKER[stickerArt].name + ' – zum Ändern klicken';
}

// Klick außerhalb schließt die Auswahl (ohne dabei gleich einen Sticker zu setzen)
let schliessKlick = false;
document.addEventListener('pointerdown', e => {
  const panel = $('sticker-panel');
  if (!panel.hidden && !panel.contains(e.target) && !$('sticker-knopf').contains(e.target)) {
    stickerAuswahl(false);
    schliessKlick = flaeche.contains(e.target);
  }

    schliessKlick = flaeche.contains(e.target);
  }
});

// ---------- Objekte anzeigen ----------
function pfadText(punkte) {
  return punkte.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
}

function neuerPfad(farbe) {
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke', farbe);
  p.setAttribute('stroke-width', '3');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.append(p);
  return p;
}

function setzeSperre(o, wert) {
  o.gesperrt = wert;
  if (o.typ === 'linie') return;
  o.el.classList.toggle('gesperrt', wert);
  if (o.schloss) {
    o.schloss.textContent = wert ? '🔒' : '🔓';
    o.schloss.title = wert ? 'Entsperren' : 'Sperren';
  }
}

function schlossHinzufuegen(o, id) {
  const knopf = element('button', 'schloss');
  knopf.addEventListener('pointerdown', e => e.stopPropagation());
  knopf.addEventListener('click', async e => {
    e.stopPropagation();
    const neu = !o.gesperrt;
    if (await mitPin(p => supabase.rpc('whiteboard_sperren', { p_id: id, p_gesperrt: neu, p_pin: p }))) setzeSperre(o, neu);
  });
  o.el.append(knopf);
  o.schloss = knopf;
}

function wegKnopfHinzufuegen(o, id) {
  if (o.weg || o.typ === 'linie' || !(bearbeitenModus || schluesselVon(id))) return;
  const knopf = element('button', 'weg-knopf', '✕');
  knopf.title = 'Löschen';
  knopf.addEventListener('pointerdown', e => e.stopPropagation());
  knopf.addEventListener('click', async e => {
    e.stopPropagation();
    if (!confirm(o.typ === 'bild' ? 'Dieses Bild löschen?' : o.typ === 'sticker' ? 'Diesen Sticker löschen?' : o.typ === 'form' ? 'Diese Form löschen?' : 'Diesen Zettel löschen?')) return;
    const ok = bearbeitenModus ? await pinLoeschen(id) : await eigenesLoeschen(id);
    if (ok) objektEntfernen(id);
  });
  o.el.append(knopf);
  o.weg = knopf;
}

function zeigeObjekt(z) {
  if (z.board !== board) return;
  const vorhanden = objekte.get(z.id);
  if (vorhanden) {
    if (vorhanden.typ !== 'linie' && !vorhanden.zieht && typeof z.x === 'number') {
      vorhanden.el.style.left = z.x + 'px';
      vorhanden.el.style.top = z.y + 'px';
    }
    if (vorhanden.typ === 'form') { if (typeof z.text === 'string' && !vorhanden.groesse) formAnwenden(vorhanden, z.text, z.farbe, z.breite); }
    else if (vorhanden.textEl && typeof z.text === 'string') vorhanden.textEl.textContent = z.text;
    if (!vorhanden.groesse && typeof z.breite === 'number') {
      if (vorhanden.typ === 'bild') vorhanden.el.style.width = z.breite + 'px';
      if (vorhanden.typ === 'sticker') { vorhanden.el.style.width = z.breite + 'px'; vorhanden.el.style.height = z.breite + 'px'; }
    }
    if (typeof z.gesperrt === 'boolean') setzeSperre(vorhanden, z.gesperrt);
    return;
  }
  if (z.typ === 'bild' && !(typeof z.bild === 'string' && z.bild.startsWith('data:image/'))) return;

  let el;
  let textEl = null;
  if (z.typ === 'linie') {
    el = neuerPfad(z.farbe);
    el.setAttribute('d', pfadText(z.punkte || []));
  } else {
    if (z.typ === 'bild') {
      el = element('div', 'objekt bild-objekt');
      const img = element('img');
      img.src = z.bild;
      img.alt = 'Bild';
      el.append(img);
      el.style.width = (z.breite || BILD_BREITE) + 'px';
      el.addEventListener('dblclick', () => zeigeGross(z.bild));
    } else if (z.typ === 'form') {
      el = element('div', 'objekt form-objekt');
    } else if (z.typ === 'sticker') {
      el = element('div', 'objekt sticker');
      el.innerHTML = stickerSvg(z.text, z.farbe);
      el.title = (STICKER[z.text] || STICKER.stern).name;
      const g = z.breite || 90;
      el.style.width = g + 'px';
      el.style.height = g + 'px';
    } else {
      el = element('div', 'objekt zettel');
      textEl = element('span', '', z.text || '');
      el.append(textEl);
      el.style.background = z.farbe;
    }
    el.style.left = z.x + 'px';
    el.style.top = z.y + 'px';
    flaeche.append(el);
  }
  const o = { el, textEl, typ: z.typ, gesperrt: false, zieht: false, schloss: null, weg: null, griff: null, groesse: false };
  if (z.typ === 'form') formAnwenden(o, z.text, z.farbe, z.breite);
  if (z.typ === 'zettel') el.addEventListener('dblclick', () => zettelBearbeiten(o, z.id));
  if (z.typ === 'form') el.addEventListener('dblclick', () => formTextBearbeiten(o, z.id));
  objekte.set(z.id, o);
  if (z.typ !== 'linie') {
    ziehbarMachen(o, z.id);
    if (bearbeitenModus) schlossHinzufuegen(o, z.id);
    wegKnopfHinzufuegen(o, z.id);
    griffHinzufuegen(o, z.id);
  }
  setzeSperre(o, !!z.gesperrt);
}

// ---------- Formen anzeigen ----------
function formAnwenden(o, text, farbe, breite) {
  const d = formDaten(text);
  o.form = d;
  if (farbe) o.farbe = farbe;
  if (breite) o.el.style.width = breite + 'px';
  o.el.style.height = d.h + 'px';
  o.el.classList.toggle('dreieck', d.f === 'dreieck');
  const knoepfe = [...o.el.querySelectorAll('.schloss, .weg-knopf, .griff')];
  o.el.innerHTML = formSvg(d.f, o.farbe || '#c9e4ff');
  o.el.append(element('span', 'form-text', d.t));
  o.el.title = FORMEN[d.f].name;
  knoepfe.forEach(k => o.el.append(k));
}

// Größe und Text ändern: Lehrende immer, Studierende nur Eigenes
async function elementAendern(id, breite, text) {
  if (bearbeitenModus) {
    return mitPin(() => supabase.rpc('whiteboard_aendern', { p_id: id, p_breite: breite, p_text: text, p_schluessel: null }));
  }
  const { data, error } = await supabase.rpc('whiteboard_aendern',
    { p_id: id, p_breite: breite, p_text: text, p_schluessel: schluesselVon(id) });
  if (error) { zeigeFehler(error.message); return false; }

async function formTextBearbeiten(o, id) {
  if (modus !== 'zeigen') return;

}

// Ziehgriff unten rechts: Bilder, Sticker und Formen in der Größe ändern
function griffHinzufuegen(o, id) {
  if (o.griff || !['bild', 'sticker', 'form'].includes(o.typ) || !(bearbeitenModus || schluesselVon(id))) return;
  const griff = element('button', 'griff');
  griff.title = 'Größe ändern';
  griff.setAttribute('aria-label', 'Größe ändern');
  griff.addEventListener('pointerdown', e => {
    e.stopPropagation();
    e.preventDefault();
    if (modus !== 'zeigen' || (o.gesperrt && !bearbeitenModus)) return;
    griff.setPointerCapture(e.pointerId);
    o.groesse = true;
    const start = punktVon(e);
    const startB = o.el.offsetWidth;
    const startH = o.el.offsetHeight;
    const links = parseInt(o.el.style.left, 10);
    const oben = parseInt(o.el.style.top, 10);
    const maxB = Math.min(1200, 2400 - links);
    const maxH = Math.min(1200, 1600 - oben);
    let b = startB;
    let h = startH;
    const bewegen = ev => {
      const p = punktVon(ev);
      if (o.typ === 'form') {
        b = Math.round(Math.min(maxB, Math.max(60, startB + p[0] - start[0])));
        h = Math.round(Math.min(maxH, Math.max(40, startH + p[1] - start[1])));
        o.el.style.width = b + 'px';
        o.el.style.height = h + 'px';
      } else {
        // Bilder und Sticker behalten ihr Seitenverhältnis
        const f = Math.max((p[0] - start[0]) / startB, (p[1] - start[1]) / startH);
        b = Math.round(Math.min(maxB, Math.max(60, startB * (1 + f))));
        o.el.style.width = b + 'px';
        if (o.typ === 'sticker') o.el.style.height = b + 'px';
      }
    };
    const loslassen = async () => {
      griff.removeEventListener('pointermove', bewegen);
      griff.removeEventListener('pointerup', loslassen);
      griff.removeEventListener('pointercancel', loslassen);
      const daten = o.typ === 'form' ? JSON.stringify({ f: o.form.f, h, t: o.form.t }) : null;
      const ok = await elementAendern(id, b, daten);
      o.groesse = false;
      if (!ok) {
        o.el.style.width = startB + 'px';
        if (o.typ !== 'bild') o.el.style.height = startH + 'px';
      } else if (o.typ === 'form') {
        o.form.h = h;
      }
    };
    griff.addEventListener('pointermove', bewegen);
    griff.addEventListener('pointerup', loslassen);
    griff.addEventListener('pointercancel', loslassen);
  });
  o.el.append(griff);
  o.griff = griff;
}

function objektEntfernen(id) {
  const o = objekte.get(id);
  if (o) { o.el.remove(); objekte.delete(id); }
}

  if (modus !== 'zeigen') return;

  const neu = prompt('Zettel bearbeiten:', o.textEl.textContent);
  if (neu === null || !neu.trim()) return;
  const text = neu.trim().slice(0, 300);
  let ok = false;
  if (bearbeitenModus) {
    ok = await mitPin(p => supabase.rpc('mit_pin_bearbeiten',
      { p_tabelle: 'whiteboard', p_id: id, p_pin: p, p_text: text }));

    const { data, error } = await supabase.rpc('eigenes_bearbeiten',
      { p_tabelle: 'whiteboard', p_id: id, p_schluessel: schluesselVon(id), p_text: text });
    if (error) zeigeFehler(error.message);
    else if (!data) zeigeFehler('Das konnte nicht geändert werden.');

  }
  if (ok) o.textEl.textContent = text;
}

  if (modus !== 'stift') return;
  e.preventDefault();
  flaeche.setPointerCapture(e.pointerId);
  aktuellerStrich = { punkte: [punktVon(e)], pfad: neuerPfad(stiftFarbe), farbe: stiftFarbe };
});

flaeche.addEventListener('pointermove', e => {
  if (!aktuellerStrich) return;
  const p = punktVon(e);
  const letzter = aktuellerStrich.punkte[aktuellerStrich.punkte.length - 1];
  if (Math.hypot(p[0] - letzter[0], p[1] - letzter[1]) < 3 || aktuellerStrich.punkte.length >= 2000) return;
  aktuellerStrich.punkte.push(p);
  aktuellerStrich.pfad.setAttribute('d', pfadText(aktuellerStrich.punkte));
});

async function strichBeenden() {
  const s = aktuellerStrich;
  aktuellerStrich = null;
  if (!s) return;
  if (s.punkte.length === 1) s.punkte.push([s.punkte[0][0] + 1, s.punkte[0][1]]);
  s.pfad.setAttribute('d', pfadText(s.punkte));
  const k = await neuerSchluessel();
  const { data, error } = await supabase.from('whiteboard')
    .insert({ board, typ: 'linie', farbe: s.farbe, punkte: s.punkte, loesch_hash: k ? k.hash : null }).select().single();
  if (error) { s.pfad.remove(); zeigeFehler(error.message); return; }
  if (objekte.has(data.id)) s.pfad.remove();
  else objekte.set(data.id, { el: s.pfad, typ: 'linie', gesperrt: false, zieht: false, schloss: null, weg: null });
  merkeEigenes(data.id, k);
}

flaeche.addEventListener('pointercancel', strichBeenden);

// ---------- Bilder einfügen ----------
function bildVerkleinern(datei) {
  return new Promise((fertig, fehler) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => {
      const faktor = Math.min(1, MAX_BILD_PIXEL / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * faktor);
      c.height = Math.round(img.height * faktor);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let qualitaet = 0.8;
      let daten = c.toDataURL('image/jpeg', qualitaet);
      while (daten.length > 780000 && qualitaet > 0.35) {
        qualitaet -= 0.15;
        daten = c.toDataURL('image/jpeg', qualitaet);
      }
      if (daten.length > 780000) { fehler(new Error('Das Bild ist zu groß.')); return; }
      fertig({ daten, breite: Math.max(60, Math.min(BILD_BREITE, c.width)) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error('Das Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function bildEinfuegen(datei) {
  try {
    const { daten, breite } = await bildVerkleinern(datei);
    const r = $('rahmen');
    const x = Math.max(0, Math.round(r.scrollLeft + r.clientWidth / 2 - breite / 2));
    const y = Math.max(0, Math.round(r.scrollTop + r.clientHeight / 2 - 120));
    const k = await neuerSchluessel();
    const { data, error } = await supabase.from('whiteboard')
      .insert({ board, typ: 'bild', bild: daten, breite, x, y, farbe: '#ffffff', loesch_hash: k ? k.hash : null })
      .select().single();
    if (error) { zeigeFehler(error.message); return; }
    zeigeObjekt(data);
    merkeEigenes(data.id, k);
  } catch (err) {
    zeigeFehler(err.message);
  }
}

document.addEventListener('paste', e => {
  const ziel = document.activeElement;
  if (ziel && (ziel.tagName === 'TEXTAREA' || ziel.tagName === 'INPUT')) return;
  const dateien = [...(e.clipboardData ? e.clipboardData.files : [])].filter(f => f.type.startsWith('image/'));
  if (!dateien.length) return;
  e.preventDefault();
  dateien.forEach(bildEinfuegen);
});

$('bild-knopf').addEventListener('click', () => $('bild-datei').click());
$('bild-datei').addEventListener('change', () => {
  [...$('bild-datei').files].forEach(bildEinfuegen);
  $('bild-datei').value = '';
});

// ---------- Verschieben ----------
function ziehbarMachen(o, id) {
  const el = o.el;
  el.addEventListener('pointerdown', e => {
    if (modus !== 'zeigen' || o.gesperrt) return;
    e.preventDefault();
    e.stopPropagation();
    o.zieht = true;
    el.classList.add('zieht');
    el.setPointerCapture(e.pointerId);
    const start = punktVon(e);
    const startX = parseInt(el.style.left, 10);
    const startY = parseInt(el.style.top, 10);
    const maxX = 2400 - el.offsetWidth;
    const maxY = 1600 - el.offsetHeight;

    const bewegen = ev => {
      const p = punktVon(ev);
      el.style.left = Math.min(maxX, Math.max(0, startX + p[0] - start[0])) + 'px';
      el.style.top = Math.min(maxY, Math.max(0, startY + p[1] - start[1])) + 'px';
    };
    const loslassen = async () => {
      el.removeEventListener('pointermove', bewegen);
      el.removeEventListener('pointerup', loslassen);
      el.removeEventListener('pointercancel', loslassen);
      el.classList.remove('zieht');
      o.zieht = false;
      const x = parseInt(el.style.left, 10);
      const y = parseInt(el.style.top, 10);
      const { error } = await supabase.from('whiteboard').update({ x, y }).eq('id', id);
      if (error) zeigeFehler(error.message);
    };
    el.addEventListener('pointermove', bewegen);
    el.addEventListener('pointerup', loslassen);
    el.addEventListener('pointercancel', loslassen);
  });
}

// ---------- Rückgängig: eigenes zuletzt Erstelltes löschen ----------
$('rueckgaengig').addEventListener('click', async () => {
  const id = meineIds().reverse().find(i => objekte.has(i) && !objekte.get(i).gesperrt);
  if (!id) return;
  if (await eigenesLoeschen(id)) objektEntfernen(id);
});

// ---------- Thema und Steuerung ----------
function zeigeThema(text) {
  const t = (text || '').trim();
  $('thema').textContent = t || 'Whiteboard';
  $('thema').classList.toggle('leer', !t);
  if (bearbeitenModus && document.activeElement !== $('thema-feld')) $('thema-feld').value = text || '';
}

async function alleSperren(wert) {
  if (await mitPin(p => supabase.rpc('whiteboard_alle_sperren', { p_board: board, p_gesperrt: wert, p_pin: p }))) {
    for (const o of objekte.values()) setzeSperre(o, wert);
  }
}

if (bearbeitenModus) {
  $('steuerung').hidden = false;
  $('thema-speichern').addEventListener('click', async () => {
    const text = $('thema-feld').value;
    const ok = await mitPin(p => supabase.rpc('fall_speichern',
      { p_board: board, p_fall: 'frage', p_text: text, p_pin: p }));
    if (ok) {
      zeigeThema(text);
      $('thema-speichern').textContent = 'Gespeichert ✓';
      setTimeout(() => { $('thema-speichern').textContent = 'Thema speichern'; }, 2000);
    }
  });
  $('alles-sperren').addEventListener('click', () => alleSperren(true));
  $('alles-entsperren').addEventListener('click', () => alleSperren(false));
  $('leeren').addEventListener('click', async () => {
    if (!confirm('Wirklich alle Zettel, Bilder und Zeichnungen auf dieser Tafel löschen?')) return;
    if (await mitPin(p => supabase.rpc('whiteboard_leeren', { p_board: board, p_pin: p }))) {
      for (const id of [...objekte.keys()]) objektEntfernen(id);
    }
  });
}

// ---------- Laden ----------
setzeModus('zeigen');
zeigeStickerKnopf();
zeigeFormKnopf();
const [r1, r2] = await Promise.all([
  supabase.from('whiteboard').select('*').eq('board', board).order('created_at'),
  supabase.from('faelle').select('*').eq('board', board).eq('fall', 'frage'),
]);
for (const r of [r1, r2]) if (r.error) zeigeFehler(r.error.message);
(r1.data || []).forEach(zeigeObjekt);
if (r2.data && r2.data[0]) zeigeThema(r2.data[0].beschreibung);

// ---------- Live-Aktualisierung ----------
const nurBoard = 'board=eq.' + board;
supabase.channel('whiteboard-' + board)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => { if (p.new.typ === 'bild') { if (!objekte.has(p.new.id)) nachladen(p.new.id); } else zeigeObjekt(p.new); })
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'whiteboard', filter: nurBoard },
      p => { if (objekte.has(p.new.id)) zeigeObjekt(p.new); else nachladen(p.new.id); })
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'whiteboard' },
      p => objektEntfernen(p.old.id))
  .on('postgres_changes', { event: '*', schema: 'public', table: 'faelle', filter: nurBoard },
      p => { if (p.new && p.new.fall === 'frage') zeigeThema(p.new.beschreibung); })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') $('status').textContent = bearbeitenModus
      ? '● Live verbunden – Bearbeiten-Modus' : '● Live verbunden';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $('status').textContent = '○ Keine Live-Verbindung (siehe Teil 6)';
    
  });
</script>
