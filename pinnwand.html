<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinnwand</title>
<style>
  /* >>> Farben: Sonnengelb <<< */
  :root {
    --hintergrund: #fff6db;
    --flaeche:     #ffffff;
    --text:        #2b2410;
    --leise:       #6b5a2e;
    --rahmen:      #e3cf94;
    --akzent:      #8a6100;
    --akzent-hell: #fdecb8;
  }

  body { font-family: system-ui, sans-serif; margin: 0; background: var(--hintergrund); color: var(--text); }
  main { max-width: 1300px; margin: 0 auto; padding: 1.5rem; }
  #status { font-size: .9rem; color: var(--leise); margin-bottom: .6rem; }
  #fehler { background: #fbebeb; color: #a00; padding: .8rem; border-radius: 8px; margin-bottom: 1rem; }
  h1 { color: #6b4e00; margin: .3rem 0 1rem; white-space: pre-wrap; }
  .box { background: var(--flaeche); border: 1px solid var(--rahmen); border-radius: 14px; padding: 1rem;
         margin-bottom: 1.5rem; display: grid; gap: .6rem; }
  .steuerung { background: var(--akzent-hell); border: 2px solid var(--akzent); }
  .box.ziel { outline: 3px dashed var(--akzent); outline-offset: 3px; }
  textarea, input { box-sizing: border-box; font: inherit; padding: .55rem .7rem; color: var(--text);
                    border: 1px solid var(--rahmen); border-radius: 8px; background: #fff; }
  textarea { width: 100%; min-height: 4rem; }
  textarea:focus, input:focus { outline: 2px solid var(--akzent); outline-offset: 1px; }
  .zeile { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .zeile input { flex: 1; min-width: 12rem; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; border-radius: 999px;
           border: 1px solid var(--rahmen); background: #fff; color: var(--text); }
  button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .hinweis { font-size: .85rem; color: var(--leise); margin: 0; }
  #anhang { display: flex; align-items: center; gap: .6rem; background: var(--akzent-hell);
            border-radius: 8px; padding: .4rem .6rem; }
  #anhang[hidden] { display: none; }
  #anhang img { height: 48px; border-radius: 4px; }
  #anhang button { padding: .1rem .55rem; font-size: .85rem; }

  #wand { columns: 280px; column-gap: 1rem; }
  .beitrag { break-inside: avoid; display: inline-block; width: 100%; box-sizing: border-box; margin-bottom: 1rem;
             padding: .9rem; border-radius: 10px; box-shadow: 0 3px 8px rgba(80,60,0,.15); color: var(--text); }
  .beitrag [hidden] { display: none !important; }
  .beitrag img.bild { display: block; width: 100%; border-radius: 6px; margin-bottom: .6rem; cursor: zoom-in; background: #fff; }
  .beitrag .text { margin: 0 0 .5rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .beitrag a { color: #1d4f8a; overflow-wrap: anywhere; }
  .anlage { display: block; background: rgba(255,255,255,.75); border-radius: 6px; padding: .4rem .6rem;
            margin-bottom: .5rem; text-decoration: none; font-weight: 600; }
  .meta { font-size: .82rem; color: #4d4430; margin-bottom: .4rem; }
  .aktionen { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; }
  .kommentar-knopf, .loeschen-knopf { padding: .25rem .7rem; font-size: .88rem; background: rgba(255,255,255,.8); }
  .loeschen-knopf { color: #8a1c14; border-color: rgba(138,28,20,.35); }
  .bearbeiten-form { display: grid; gap: .4rem; margin-bottom: .5rem; }
  .bearbeiten-form input { width: 100%; }
  .bearbeiten-form button { padding: .3rem .8rem; font-size: .9rem; }
  .kommentare { margin-top: .6rem; border-top: 1px solid rgba(0,0,0,.12); padding-top: .5rem; }
  .kommentar { position: relative; font-size: .9rem; background: rgba(255,255,255,.8); border-radius: 6px;
               padding: .4rem 3.6rem .4rem .55rem; margin-bottom: .35rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .kommentar .wer { display: block; font-size: .78rem; color: #4d4430; }
  .kommentar .weg, .kommentar .bearb { position: absolute; top: .2rem; padding: 0 .4rem; font-size: .85rem;
                                       background: transparent; border: none; color: #8a1c14; }
  .kommentar .weg { right: .25rem; }
  .kommentar .bearb { right: 1.8rem; color: var(--text); }
  .kommentare form { display: flex; gap: .35rem; }
  .kommentare input { flex: 1; min-width: 0; padding: .35rem .5rem; font-size: .92rem; }
  .kommentare form button { padding: .3rem .7rem; font-size: .9rem; }
  #leer { color: var(--leise); font-style: italic; }

  #gross { position: fixed; inset: 0; background: rgba(30,25,10,.85); display: flex; align-items: center;
           justify-content: center; padding: 1.5rem; z-index: 20; cursor: zoom-out; }
  #gross[hidden] { display: none; }
  #gross img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<main>
  <div id="status">Verbinde …</div>
  <div id="fehler" hidden></div>

  <div class="box steuerung" id="steuerung" hidden>
    <strong>Überschrift oder Arbeitsauftrag</strong>
    <textarea id="thema-feld" placeholder="z. B. Teilt hier Quellen zum Thema Inklusion"></textarea>
    <div class="zeile"><button id="thema-speichern" class="haupt">Speichern</button></div>
  </div>

  <h1 id="thema">Pinnwand</h1>

  <div class="box" id="neu">
    <input id="name-feld" maxlength="60" placeholder="Dein Name (optional)">
    <textarea id="text-feld" maxlength="1000" placeholder="Dein Beitrag … (Bilder auch mit Cmd+V einfügen)"></textarea>
    <input id="link-feld" maxlength="500" placeholder="Link (optional), z. B. https://…">
    <div id="anhang" hidden></div>
    <div class="zeile">
      <button id="datei-knopf">📎 Bild oder Datei</button>
      <input type="file" id="datei-feld" hidden
             accept="image/*,.pdf,.txt,.doc,.docx,.ppt,.pptx,.xls,.xlsx">
      <button id="senden" class="haupt">Anheften</button>
    </div>
    <p class="hinweis">Erlaubt: Bilder, PDF, Word, PowerPoint, Excel und Text, höchstens 10 MB. Eigene Beiträge kannst du auf diesem Gerät bearbeiten und löschen.</p>
  </div>

  <p id="leer">Noch keine Beiträge.</p>
  <div id="wand"></div>
</main>
<div id="gross" hidden><img alt="Bild in groß"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/+esm';

// >>> Einstellungen <<<
const ZETTELFARBEN = ['#fff59d', '#c8f0c8', '#c9e4ff', '#ffb3b0', '#ffe0b2', '#e1d5ff', '#f9c6f0', '#e6e6e6'];
const MAX_MB = 10;
const BILD_PIXEL = 1600;

// >>> Hier deine beiden Werte aus Teil 3 eintragen <<<
const supabase = createClient('https://oeqlvlrnflqfevktfyuz.supabase.co', 'sb_publishable_x7jDXG-iMW23TDVUm9HSEA_bDANHESG');

const board = location.hash.slice(1) || 'start';
const bearbeitenModus = new URLSearchParams(location.search).has('bearbeiten');
const $ = id => document.getElementById(id);
const beitraege = new Map();          // Schlüssel -> Beitrag mit seinen Elementen
const kommentarElemente = new Map();  // Kommentar-Nummer -> Kommentar mit seinen Elementen
let anhang = null;
let pin = null;

// ---------- Hilfsfunktionen ----------
function lesen(key) { try { return localStorage.getItem(key); } catch { return null; } }
function schreiben(key, wert) { try { localStorage.setItem(key, wert); } catch {} }

function zeigeFehler(text) {
  $('fehler').textContent = 'Fehler: ' + text;
  $('fehler').hidden = false;
}

function element(tag, klasse, text) {
  const el = document.createElement(tag);
  if (klasse) el.className = klasse;
  if (text) el.textContent = text;
  return el;
}

function zeit(datum) {
  return new Date(datum).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' });
}

function textMitLinks(el, text) {
  text.split(/(https?:\/\/[^\s]+)/g).forEach((teil, i) => {
    if (i % 2 === 1) {
      const a = element('a', '', teil);
      a.href = teil;
      a.target = '_blank';
      a.rel = 'noopener';
      el.append(a);
    } else if (teil) {
      el.append(teil);
    }
  });
}

function istBild(typ) { return typeof typ === 'string' && typ.startsWith('image/'); }

async function mitPin(aktion) {
  if (!pin) pin = prompt('login');
  if (!pin) return false;
  const { error } = await aktion(pin);
  if (error) { pin = null; zeigeFehler(error.message); return false; }
  return true;
}

$('name-feld').value = lesen('ideen-name') || '';
$('name-feld').addEventListener('input', () => schreiben('ideen-name', $('name-feld').value));
const meinName = () => $('name-feld').value.trim() || null;

$('gross').addEventListener('click', () => { $('gross').hidden = true; });
function zeigeGross(src) {
  $('gross').querySelector('img').src = src;
  $('gross').hidden = false;
}

// ---------- Eigene Beiträge wiedererkennen ----------
function eigeneLesen() { try { return JSON.parse(localStorage.getItem('eigene-schluessel') || '{}'); } catch { return {}; } }
const eigene = eigeneLesen();
function eigeneSpeichern() { try { localStorage.setItem('eigene-schluessel', JSON.stringify(eigene)); } catch {} }

async function neuerSchluessel() {
  if (!(window.crypto && crypto.subtle)) return null;
  const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
  const schluessel = hex(crypto.getRandomValues(new Uint8Array(16)));
  const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(schluessel));
  return { schluessel, hash: hex(new Uint8Array(hash)) };
}

function merkeEigenes(tabelle, id, k) {
  if (!k) return;
  eigene[tabelle + ':' + id] = { s: k.schluessel, b: board, t: Date.now() };
  eigeneSpeichern();
}

const schluesselVon = (tabelle, id) => (eigene[tabelle + ':' + id] || {}).s || null;

async function loeschen(tabelle, id) {
  if (bearbeitenModus) {
    return mitPin(p => supabase.rpc('mit_pin_loeschen', { p_tabelle: tabelle, p_id: id, p_pin: p }));
  }
  const s = schluesselVon(tabelle, id);
  if (!s) return false;
  const { data, error } = await supabase.rpc('eigenes_loeschen', { p_tabelle: tabelle, p_id: id, p_schluessel: s });
  if (error) { zeigeFehler(error.message); return false; }
  if (!data) { zeigeFehler('Das konnte nicht gelöscht werden.'); return false; }
  delete eigene[tabelle + ':' + id];
  eigeneSpeichern();
  return true;
}

async function aendern(tabelle, id, text, link = null) {
  if (bearbeitenModus) {
    return mitPin(p => supabase.rpc('mit_pin_bearbeiten',
      { p_tabelle: tabelle, p_id: id, p_pin: p, p_text: text, p_link: link }));
  }
  const s = schluesselVon(tabelle, id);
  if (!s) return false;
  const { data, error } = await supabase.rpc('eigenes_bearbeiten',
    { p_tabelle: tabelle, p_id: id, p_schluessel: s, p_text: text, p_link: link });
  if (error) { zeigeFehler(error.message); return false; }
  if (!data) { zeigeFehler('Das konnte nicht geändert werden.'); return false; }
  return true;
}

// ---------- Anhang wählen ----------
function setzeAnhang(datei) {
  anhang = datei;
  const box = $('anhang');
  box.replaceChildren();
  box.hidden = !datei;
  if (!datei) return;
  if (istBild(datei.type)) {
    const vorschau = element('img');
    vorschau.src = URL.createObjectURL(datei);
    box.append(vorschau);
  }
  box.append(element('span', '', '📎 ' + (datei.name || 'Bild')));
  const weg = element('button', '', '✕');
  weg.title = 'Anhang entfernen';
  weg.addEventListener('click', () => setzeAnhang(null));
  box.append(weg);
}

$('datei-knopf').addEventListener('click', () => $('datei-feld').click());
$('datei-feld').addEventListener('change', () => {
  if ($('datei-feld').files[0]) setzeAnhang($('datei-feld').files[0]);
  $('datei-feld').value = '';
});
$('text-feld').addEventListener('paste', e => {
  const bild = [...(e.clipboardData ? e.clipboardData.files : [])].find(f => istBild(f.type));
  if (!bild) return;
  e.preventDefault();
  setzeAnhang(bild);
});
$('neu').addEventListener('dragover', e => { e.preventDefault(); $('neu').classList.add('ziel'); });
$('neu').addEventListener('dragleave', () => $('neu').classList.remove('ziel'));
$('neu').addEventListener('drop', e => {
  e.preventDefault();
  $('neu').classList.remove('ziel');
  if (e.dataTransfer.files[0]) setzeAnhang(e.dataTransfer.files[0]);
});

// ---------- Hochladen ----------
function bildVerkleinern(datei) {
  return new Promise((fertig, fehler) => {
    const url = URL.createObjectURL(datei);
    const img = new Image();
    img.onload = () => {
      const faktor = Math.min(1, BILD_PIXEL / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * faktor);
      c.height = Math.round(img.height * faktor);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(blob => blob ? fertig(blob) : fehler(new Error('Das Bild konnte nicht verkleinert werden.')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); fehler(new Error('Das Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function hochladen(datei) {
  let inhalt = datei;
  let typ = datei.type || 'application/octet-stream';
  let name = datei.name || 'bild.png';
  if (istBild(typ) && typ !== 'image/gif') {
    inhalt = await bildVerkleinern(datei);
    typ = 'image/jpeg';
    name = name.replace(/\.[^.]+$/, '') + '.jpg';
  }
  if (inhalt.size > MAX_MB * 1024 * 1024) throw new Error('Die Datei ist größer als ' + MAX_MB + ' MB.');
  const sicher = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9._-]/g, '_').slice(-80);
  const pfad = board + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + '-' + sicher;
  const { error } = await supabase.storage.from('pinnwand').upload(pfad, inhalt, { contentType: typ });
  if (error) throw error;
  const { data } = supabase.storage.from('pinnwand').getPublicUrl(pfad);
  return { datei_url: data.publicUrl, datei_name: name.slice(0, 200), datei_typ: typ };
}

// ---------- Beitrag anheften ----------
$('senden').addEventListener('click', async () => {
  const text = $('text-feld').value.trim();
  let link = $('link-feld').value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  if (!text && !link && !anhang) return;
  const knopf = $('senden');
  knopf.disabled = true;
  knopf.textContent = anhang ? 'Wird hochgeladen …' : 'Wird angeheftet …';
  try {
    const datei = anhang ? await hochladen(anhang) : {};
    const k = await neuerSchluessel();
    const { data, error } = await supabase.from('ideen')
      .insert({ board, text, name: meinName(), link: link || null, loesch_hash: k ? k.hash : null, ...datei })
      .select('id').single();
    if (error) throw error;
    merkeEigenes('ideen', data.id, k);
    const e = beitraege.get('i' + data.id);
    if (e) { bearbeitenKnopf(e); loeschKnopf(e, 'ideen'); }
    $('text-feld').value = '';
    $('link-feld').value = '';
    setzeAnhang(null);
  } catch (err) {
    zeigeFehler(err.message);
  }
  knopf.disabled = false;
  knopf.textContent = 'Anheften';
});

// ---------- Beiträge anzeigen ----------
function inhaltSetzen(e, neu) {
  e.daten = { ...e.daten, ...neu };
  const d = e.daten;
  const text = (d.text || '').trim();
  e.textEl.replaceChildren();
  if (text) textMitLinks(e.textEl, text);
  e.textEl.hidden = !text || !!e.form;
  if (d.link) {
    let ziel = d.link;
    try { ziel = new URL(d.link).hostname.replace(/^www\./, ''); } catch {}
    e.linkEl.textContent = '🔗 ' + ziel;
    e.linkEl.href = d.link;
    e.linkEl.hidden = !!e.form;
  } else {
    e.linkEl.hidden = true;
    e.linkEl.removeAttribute('href');
  }
  e.meta.textContent = (d.name || 'Anonym') + ' · ' + zeit(d.created_at) + (d.bearbeitet_am ? ' · bearbeitet' : '');
}

function loeschKnopf(e, tabelle) {
  if (e.weg || !(bearbeitenModus || schluesselVon(tabelle, e.daten.id))) return;
  const weg = element('button', 'loeschen-knopf', '🗑 Löschen');
  weg.addEventListener('click', async () => {
    if (!confirm('Diesen Beitrag wirklich löschen?')) return;
    if (await loeschen(tabelle, e.daten.id)) beitragEntfernen(e.schluessel);
  });
  e.aktionen.append(weg);
  e.weg = weg;
}

function bearbeitenKnopf(e) {
  if (e.bearb || e.alt || !(bearbeitenModus || schluesselVon('ideen', e.daten.id))) return;
  const knopf = element('button', 'kommentar-knopf', '✏️ Bearbeiten');
  knopf.addEventListener('click', () => bearbeitenOeffnen(e));
  e.aktionen.insertBefore(knopf, e.weg || null);
  e.bearb = knopf;
}

function bearbeitenOeffnen(e) {
  if (e.form) return;
  const form = element('form', 'bearbeiten-form');
  const feld = element('textarea');
  feld.maxLength = 1000;
  feld.value = e.daten.text || '';
  const linkFeld = element('input');
  linkFeld.maxLength = 500;
  linkFeld.placeholder = 'Link (optional)';
  linkFeld.value = e.daten.link || '';
  const speichern = element('button', 'haupt', 'Speichern');
  const abbrechen = element('button', '', 'Abbrechen');
  abbrechen.type = 'button';
  const zeile = element('div', 'zeile');
  zeile.append(speichern, abbrechen);
  form.append(feld, linkFeld, zeile);
  e.meta.before(form);
  e.form = form;
  inhaltSetzen(e, {});

  const schliessen = () => { form.remove(); e.form = null; inhaltSetzen(e, {}); };
  abbrechen.addEventListener('click', schliessen);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const text = feld.value.trim();
    let link = linkFeld.value.trim();
    if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
    if (!text && !link && !e.daten.datei_url) { zeigeFehler('Ein Beitrag braucht Text, einen Link oder eine Datei.'); return; }
    speichern.disabled = true;
    const ok = await aendern('ideen', e.daten.id, text, link || null);
    speichern.disabled = false;
    if (ok) {
      e.daten.text = text;
      e.daten.link = link || null;
      e.daten.bearbeitet_am = new Date().toISOString();
      schliessen();
    }
  });
  feld.focus();
}

function karteErstellen(schluessel, p, mitKommentaren) {
  const el = element('div', 'beitrag');
  el.style.background = ZETTELFARBEN[p.id % ZETTELFARBEN.length];

  if (p.datei_url && istBild(p.datei_typ)) {
    const img = element('img', 'bild');
    img.src = p.datei_url;
    img.alt = p.datei_name || 'Bild';
    img.loading = 'lazy';
    img.addEventListener('click', () => zeigeGross(p.datei_url));
    el.append(img);
  }
  const textEl = element('p', 'text');
  const linkEl = element('a', 'anlage');
  linkEl.target = '_blank';
  linkEl.rel = 'noopener';
  el.append(textEl, linkEl);
  if (p.datei_url && !istBild(p.datei_typ)) {
    const a = element('a', 'anlage', '📎 ' + (p.datei_name || 'Datei'));
    a.href = p.datei_url;
    a.target = '_blank';
    a.rel = 'noopener';
    el.append(a);
  }
  const meta = element('div', 'meta');
  const aktionen = element('div', 'aktionen');
  el.append(meta, aktionen);

  const e = { schluessel, daten: p, alt: !mitKommentaren, el, textEl, linkEl, meta, aktionen,
              kommentare: new Set(), liste: null, knopf: null, weg: null, bearb: null, form: null };
  inhaltSetzen(e, {});

  if (mitKommentaren) {
    const knopf = element('button', 'kommentar-knopf');
    const bereich = element('div', 'kommentare');
    bereich.hidden = true;
    const liste = element('div');
    const form = element('form');
    const input = element('input');
    input.maxLength = 500;
    input.required = true;
    input.placeholder = 'Kommentar …';
    form.append(input, element('button', '', 'Senden'));
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const k = await neuerSchluessel();
      const { data, error } = await supabase.from('kommentare')
        .insert({ idee_id: p.id, board, text: input.value.trim(), name: meinName(), loesch_hash: k ? k.hash : null })
        .select('id').single();
      if (error) { zeigeFehler(error.message); return; }
      input.value = '';
      merkeEigenes('kommentare', data.id, k);
      const vorhanden = kommentarElemente.get(data.id);
      if (vorhanden) kommentarKnoepfe(data.id, vorhanden);
    });
    bereich.append(liste, form);
    knopf.addEventListener('click', () => { bereich.hidden = !bereich.hidden; });
    aktionen.append(knopf);
    el.append(bereich);
    e.liste = liste;
    e.knopf = knopf;
  }
  beitraege.set(schluessel, e);
  bearbeitenKnopf(e);
  loeschKnopf(e, mitKommentaren ? 'ideen' : 'notes');
  aktualisiereKnopf(e);
  return el;
}

function aktualisiereKnopf(e) {
  if (e.knopf) e.knopf.textContent = '💬 ' + e.kommentare.size + (e.kommentare.size === 1 ? ' Kommentar' : ' Kommentare');
}

function neuerBeitrag(p, alt = false, oben = true) {
  const schluessel = (alt ? 'n' : 'i') + p.id;
  if (p.board !== board || beitraege.has(schluessel)) return;
  const el = karteErstellen(schluessel, p, !alt);
  if (oben) $('wand').prepend(el); else $('wand').append(el);
  $('leer').hidden = true;
}

function beitragEntfernen(schluessel) {
  const e = beitraege.get(schluessel);
  if (e) e.el.remove();
  beitraege.delete(schluessel);
  $('leer').hidden = beitraege.size > 0;
}

// ---------- Kommentare ----------
function kommentarText(k) {
  const d = k.daten;
  k.wer.textContent = (d.name || 'Anonym') + ' · ' + zeit(d.created_at) + (d.bearbeitet_am ? ' · bearbeitet' : '');
  k.textEl.replaceChildren();
  textMitLinks(k.textEl, d.text || '');
}

function kommentarKnoepfe(id, k) {
  if (k.weg || !(bearbeitenModus || schluesselVon('kommentare', id))) return;
  const bearb = element('button', 'bearb', '✏️');
  bearb.title = 'Kommentar bearbeiten';
  bearb.addEventListener('click', async () => {
    const neu = prompt('Kommentar bearbeiten:', k.daten.text);
    if (neu === null || !neu.trim()) return;
    const text = neu.trim().slice(0, 500);
    if (await aendern('kommentare', id, text)) {
      k.daten.text = text;
      k.daten.bearbeitet_am = new Date().toISOString();
      kommentarText(k);
    }
  });
  const weg = element('button', 'weg', '✕');
  weg.title = 'Kommentar löschen';
  weg.addEventListener('click', async () => {
    if (!confirm('Diesen Kommentar wirklich löschen?')) return;
    if (await loeschen('kommentare', id)) kommentarEntfernen(id);
  });
  k.el.append(bearb, weg);
  k.weg = weg;
}

function neuerKommentar(daten) {
  const e = beitraege.get('i' + daten.idee_id);
  if (!e || !e.liste || e.kommentare.has(daten.id)) return;
  e.kommentare.add(daten.id);
  const box = element('div', 'kommentar');
  const wer = element('span', 'wer');
  const textEl = element('span');
  box.append(wer, textEl);
  e.liste.append(box);
  const k = { daten, el: box, wer, textEl, eintrag: e, weg: null };
  kommentarElemente.set(daten.id, k);
  kommentarText(k);
  kommentarKnoepfe(daten.id, k);
  aktualisiereKnopf(e);
}

function kommentarAktualisieren(daten) {
  const k = kommentarElemente.get(daten.id);
  if (!k) return;
  k.daten = { ...k.daten, ...daten };
  kommentarText(k);
}

function kommentarEntfernen(id) {
  const k = kommentarElemente.get(id);
  if (!k) return;
  k.el.remove();
  k.eintrag.kommentare.delete(id);
  aktualisiereKnopf(k.eintrag);
  kommentarElemente.delete(id);
}

// ---------- Überschrift ----------
function zeigeThema(text) {
  const t = (text || '').trim();
  $('thema').textContent = t || 'Pinnwand';
  if (bearbeitenModus && document.activeElement !== $('thema-feld')) $('thema-feld').value = text || '';
}

if (bearbeitenModus) {
  $('steuerung').hidden = false;
  $('thema-speichern').addEventListener('click', async () => {
    const text = $('thema-feld').value;
    if (await mitPin(p => supabase.rpc('fall_speichern', { p_board: board, p_fall: 'frage', p_text: text, p_pin: p }))) {
      zeigeThema(text);
      $('thema-speichern').textContent = 'Gespeichert ✓';
      setTimeout(() => { $('thema-speichern').textContent = 'Speichern'; }, 2000);
    }
  });
}

// ---------- Laden ----------
const [r1, r2, r3, r4] = await Promise.all([
  supabase.from('ideen').select('*').eq('board', board),
  supabase.from('notes').select('*').eq('board', board).eq('kachel', 'allgemein'),
  supabase.from('kommentare').select('*').eq('board', board).order('created_at'),
  supabase.from('faelle').select('*').eq('board', board).eq('fall', 'frage'),
]);
for (const r of [r1, r2, r3, r4]) if (r.error) zeigeFehler(r.error.message);
const alle = [
  ...(r1.data || []).map(p => ({ p, alt: false })),
  ...(r2.data || []).map(p => ({ p, alt: true })),
].sort((a, b) => new Date(b.p.created_at) - new Date(a.p.created_at));
alle.forEach(({ p, alt }) => neuerBeitrag(p, alt, false));
(r3.data || []).forEach(neuerKommentar);
if (r4.data && r4.data[0]) zeigeThema(r4.data[0].beschreibung);
$('leer').hidden = beitraege.size > 0;

// ---------- Live-Aktualisierung ----------
const nurBoard = 'board=eq.' + board;
supabase.channel('pinnwand-' + board)
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'ideen', filter: nurBoard },
      p => neuerBeitrag(p.new))
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'ideen', filter: nurBoard },
      p => { const e = beitraege.get('i' + p.new.id); if (e && !e.form) inhaltSetzen(e, p.new); })
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'ideen' },
      p => beitragEntfernen('i' + p.old.id))
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notes' },
      p => beitragEntfernen('n' + p.old.id))
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'kommentare', filter: nurBoard },
      p => neuerKommentar(p.new))
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'kommentare', filter: nurBoard },
      p => kommentarAktualisieren(p.new))
  .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'kommentare' },
      p => kommentarEntfernen(p.old.id))
  .on('postgres_changes', { event: '*', schema: 'public', table: 'faelle', filter: nurBoard },
      p => { if (p.new && p.new.fall === 'frage') zeigeThema(p.new.beschreibung); })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') $('status').textContent = bearbeitenModus
      ? '● Live verbunden – Bearbeiten-Modus' : '● Live verbunden';
    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') $('status').textContent = '○ Keine Live-Verbindung (siehe Teil 6)';
    
  });
</script>
